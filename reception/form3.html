<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=9"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form III — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=30">
    <style>
        .f3-row { cursor: pointer; }
        .f3-row:hover { background: oklch(var(--b2)); }
        .f3-label { font-size: 12px; opacity: .7; margin-bottom: 2px; }
        .f3-bm { cursor: grab; }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
            <h1 class="text-2xl font-bold">Form III</h1>
            <button class="btn btn-primary btn-sm" data-act="new">+ Новый иностранец</button>
        </div>
        <p class="text-sm opacity-70 mb-4">Регистрация иностранцев в FRRO: подать в течение 24 часов после приезда, отметить выезд в течение суток после отъезда.</p>

        <!-- Сводка упущений (⚠ сверху) -->
        <div id="f3Summary" class="mb-4"></div>

        <div class="mb-3">
            <input type="search" id="f3Search" class="input input-bordered input-sm w-full max-w-md"
                   placeholder="Поиск: имя, фамилия по паспорту, страна, комната, номер анкеты">
        </div>
        <div role="tablist" class="tabs tabs-boxed bg-base-100 mb-4 inline-flex flex-wrap">
            <a role="tab" class="tab tab-active" data-tab="submit">Подать <span id="cntSubmit" class="ml-1"></span></a>
            <a role="tab" class="tab" data-tab="unknown">Гражданство не указано <span id="cntUnknown" class="ml-1"></span></a>
            <a role="tab" class="tab" data-tab="submitted">Поданы <span id="cntSubmitted" class="ml-1"></span></a>
            <a role="tab" class="tab" data-tab="checkout">Выписка</a>
            <a role="tab" class="tab" data-tab="bookmarks">Закладки</a>
        </div>

        <section data-pane="submit"><div id="listSubmit"><div class="skeleton h-24 w-full"></div></div></section>
        <section data-pane="unknown" class="hidden"><div id="listUnknown"></div></section>
        <section data-pane="submitted" class="hidden"><div id="listSubmitted"></div></section>
        <!-- Вкладка «Выписка» — код в js/pages/form3-checkout.js (сессия «Form III Checkout») -->
        <section data-pane="checkout" class="hidden"><div id="checkout-tab"></div></section>
        <section data-pane="bookmarks" class="hidden"><div id="bookmarksPane"></div></section>
    </main>

    <!-- Карточка человека -->
    <dialog id="personModal" class="modal">
        <div class="modal-box max-w-4xl">
            <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
            <div id="personModalBody"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Новый иностранец: контакт сразу с паспортными данными -->
    <dialog id="newModal" class="modal">
        <div class="modal-box max-w-2xl">
            <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
            <div id="newModalBody"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/auth-check.js?v=18"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=23"></script>
    <script src="../js/date-utils.js?v=5"></script>
    <script src="../js/layout.js?v=132"></script>
    <script src="../js/pages/form3.js?v=7"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'housing', menuId: 'reception', itemId: 'form3' });
            if (!window.currentUser?.is_superuser) {
                document.querySelector('main').innerHTML = '<div class="alert alert-warning">Раздел доступен только суперпользователям.</div>';
                return;
            }
            Form3.init();
        }
        init();
    </script>
</body>
</html>
