<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=9"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="buildings_page_title">Здания — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=29">
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1">

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h1 class="text-2xl font-bold" data-i18n="buildings_title">Здания</h1>
            <button class="btn btn-primary gap-2" onclick="openBuildingModal()" data-permission="edit_buildings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span data-i18n="add_building">Добавить здание</span>
            </button>
        </div>

        <!-- Buildings List -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="buildingsList">
            <!-- Will be generated by JS -->
        </div>

        <div id="noBuildings" class="hidden text-center py-12 opacity-50">
            <div class="text-4xl mb-2">🏢</div>
            <p data-i18n="no_buildings">Зданий пока нет</p>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <!-- Add/Edit Building Modal -->
    <dialog id="buildingModal" class="modal">
        <div class="modal-box max-w-lg relative">
            <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="closeBuildingModal()">✕</button>
            <h3 class="font-bold text-lg mb-4" id="buildingModalTitle" data-i18n="add_building">Добавить здание</h3>

            <form id="buildingForm" class="space-y-4">
                <input type="hidden" name="id" />

                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="building_name">Название</span><span class="text-error ml-1">*</span></label>
                    <input type="text" name="name_ru" class="input input-bordered w-full" required />
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label"><span class="label-text font-medium" data-i18n="buildings_name_en">Name (EN)</span></label>
                        <input type="text" name="name_en" class="input input-bordered w-full" />
                    </div>
                    <div>
                        <label class="label"><span class="label-text font-medium" data-i18n="buildings_name_hi">नाम (HI)</span></label>
                        <input type="text" name="name_hi" class="input input-bordered w-full" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label"><span class="label-text font-medium" data-i18n="building_type">Тип здания</span></label>
                        <select name="building_type_id" id="buildingTypeSelect" class="select select-bordered w-full">
                            <option value="">—</option>
                        </select>
                    </div>
                    <div>
                        <label class="label"><span class="label-text font-medium" data-i18n="building_floors">Этажей</span></label>
                        <input type="number" name="floors" class="input input-bordered w-full" min="1" value="1" />
                    </div>
                </div>

                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="building_address">Адрес</span></label>
                    <input type="text" name="address" class="input input-bordered w-full" />
                </div>

                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="description">Описание</span></label>
                    <textarea name="description_ru" rows="2" class="textarea textarea-bordered w-full"></textarea>
                </div>

                <div class="form-control">
                    <label class="label cursor-pointer justify-start gap-2">
                        <input type="checkbox" name="is_active" class="checkbox checkbox-primary" checked />
                        <span class="label-text" data-i18n="active">Активно</span>
                    </label>
                </div>

                <!-- Временное размещение -->
                <div class="form-control">
                    <label class="label cursor-pointer justify-start gap-2">
                        <input type="checkbox" name="is_temporary" id="isTemporaryCheckbox" class="checkbox checkbox-warning" />
                        <span class="label-text" data-i18n="temporary_building">Временное размещение</span>
                    </label>
                </div>

                <div id="temporaryDatesSection" class="hidden">
                    <!-- Доступно всегда -->
                    <div class="form-control mb-3">
                        <label class="label cursor-pointer justify-start gap-2">
                            <input type="checkbox" id="alwaysAvailableCheckbox" class="checkbox checkbox-sm" />
                            <span class="label-text" data-i18n="always_available">Доступно всегда</span>
                        </label>
                    </div>

                    <div id="datesInputSection">
                        <label class="label"><span class="label-text font-medium" data-i18n="rental_period">Период аренды</span><span class="text-error ml-1">*</span></label>
                        <!-- Несколько периодов: свои даты или ретрит ± до недели (мигр. 723) -->
                        <div id="rentalPeriods" class="space-y-2"></div>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <button type="button" class="btn btn-sm btn-ghost gap-1" data-rental-add="dates">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                <span data-i18n="rental_add_dates">Добавить даты</span>
                            </button>
                            <button type="button" class="btn btn-sm btn-ghost gap-1" data-rental-add="retreat">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                <span data-i18n="rental_add_retreat">Добавить ретрит</span>
                            </button>
                        </div>
                        <!-- Закончившиеся периоды не правятся — это история использования -->
                        <details id="rentalHistory" class="hidden mt-3">
                            <summary class="cursor-pointer text-sm font-medium opacity-70" data-i18n="rental_history">История использования</summary>
                            <div id="rentalHistoryList" class="mt-2 space-y-1 text-sm"></div>
                        </details>
                    </div>
                </div>

                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" onclick="closeBuildingModal()" data-i18n="cancel">Отмена</button>
                    <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
                </div>
            </form>

            <!-- Delete button -->
            <div id="deleteBuildingSection" class="hidden border-t border-base-200 mt-4 pt-4">
                <button type="button" class="btn btn-ghost btn-error btn-sm gap-1" onclick="deleteBuilding()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span data-i18n="delete_building">Удалить здание</span>
                </button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/auth-check.js?v=17"></script>
    <script src="../js/permissions-ui.js?v=2"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=23"></script>
    <script src="../js/translit.js"></script>
    <script src="../js/auto-translate.js"></script>
    <script src="../js/date-utils.js?v=5"></script>
    <script src="../js/layout.js?v=124"></script>
    <script>
        // ==================== STATE ====================
        let buildings = [];
        let buildingTypes = [];
        let roomCounts = {};
        let editingBuildingId = null;
        let retreats = [];
        // Закончившиеся периоды редактируемого здания — в форме не правятся (история)
        let pastPeriods = [];

        const t = key => Layout.t(key);
        const tf = (key, fallback) => { const v = Layout.t(key); return v === key ? fallback : v; };
        const e = str => Layout.escapeHtml(str);
        const today = () => DateUtils.toISO(new Date());

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const date = DateUtils.parseDate(dateStr);
            return date.toLocaleDateString(Layout.currentLang === 'hi' ? 'hi-IN' : Layout.currentLang === 'en' ? 'en-US' : 'ru-RU', {
                day: 'numeric', month: 'short'
            });
        }

        // ==================== DATA ====================
        async function loadBuildingTypes() {
            const data = await Cache.getOrLoad('building_types', async () => {
                const { data, error } = await Layout.db.from('building_types').select('*').order('sort_order');
                if (error) { console.error('Error loading building_types:', error); return null; }
                return data;
            });
            return data || [];
        }

        async function loadBuildings() {
            const { data } = await Layout.db
                .from('buildings')
                .select('*, building_types(id, slug, name_ru, name_en, name_hi, color), building_rental_periods(id, date_from, date_to, retreat_id, days_before, days_after)')
                .order('sort_order');
            return data || [];
        }

        async function loadRetreats() {
            const { data, error } = await Layout.db.from('retreats')
                .select('id, name_ru, name_en, name_hi, start_date, end_date')
                .not('start_date', 'is', null).not('end_date', 'is', null)
                .order('start_date');
            if (error) console.error('Error loading retreats:', error);
            return data || [];
        }

        // «17 авг. — 10 сент. · Сева-ретрит (−3/+2)»
        function periodLabel(p) {
            const r = p.retreat_id ? retreats.find(x => x.id === p.retreat_id) : null;
            const shift = r && (p.days_before || p.days_after) ? ` (−${p.days_before}/+${p.days_after})` : '';
            return `${formatDate(p.date_from)} — ${formatDate(p.date_to)}${r ? ' · ' + Layout.getName(r) + shift : ''}`;
        }

        async function loadRoomCounts() {
            const { data } = await Layout.db
                .from('rooms')
                .select('building_id')
                .eq('is_active', true);

            const counts = {};
            (data || []).forEach(r => {
                counts[r.building_id] = (counts[r.building_id] || 0) + 1;
            });
            return counts;
        }


        // ==================== RENDER ====================

        function renderBuildings() {
            const list = Layout.$('#buildingsList');
            const noBuildings = Layout.$('#noBuildings');

            if (buildings.length === 0) {
                list.innerHTML = '';
                noBuildings.classList.remove('hidden');
                return;
            }

            noBuildings.classList.add('hidden');

            list.innerHTML = buildings.map(building => {
                const type = building.building_types;
                const roomCount = roomCounts[building.id] || 0;

                return `
                    <div class="bg-base-100 rounded-lg shadow-sm overflow-hidden ${!building.is_active ? 'opacity-50' : ''}" style="border-left: 4px solid ${type?.color || '#6366f1'}">
                        <div class="p-4">
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <div>
                                    <h3 class="font-semibold text-lg">${Layout.getName(building)}</h3>
                                    <div class="flex flex-wrap gap-1 mt-1">
                                        ${type ? `<span class="badge badge-sm" style="background-color: ${type.color}20; color: ${type.color}; border-color: ${type.color}">${Layout.getName(type)}</span>` : ''}
                                        ${building.is_temporary ? `<span class="badge badge-warning badge-sm">${t('temporary')}</span>` : ''}
                                    </div>
                                </div>
                                <button class="btn btn-ghost btn-sm btn-square" onclick="openBuildingModal('${building.id}')">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                    </svg>
                                </button>
                            </div>

                            <div class="grid grid-cols-2 gap-2 text-sm opacity-70">
                                <div class="flex items-center gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                    </svg>
                                    ${building.floors} ${t('building_floors')}
                                </div>
                                <div class="flex items-center gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                                    </svg>
                                    ${roomCount} ${t('building_rooms_count')}
                                </div>
                            </div>

                            ${building.is_temporary ? renderCardPeriods(building) : ''}
                            ${building.description_ru ? `<p class="text-sm opacity-60 mt-2">${building['description_' + Layout.currentLang] || building.description_ru}</p>` : ''}

                            <div class="mt-3 flex gap-2">
                                <a href="rooms.html?building=${building.id}" class="btn btn-ghost btn-sm gap-1">
                                    ${t('nav_rooms')}
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                    </svg>
                                </a>
                                <a href="floor-plan.html?building=${building.id}" class="btn btn-ghost btn-sm gap-1">
                                    ${t('btn_view_plan')}
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Действующие и будущие периоды на карточке; все закончились — «Аренда закончилась»
        function renderCardPeriods(building) {
            const all = building.building_rental_periods || [];
            if (!all.length) return '';
            const actual = all.filter(p => p.date_to >= today()).sort((a, b) => a.date_from.localeCompare(b.date_from));
            const icon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`;
            const lines = actual.length
                ? actual.map(p => `<div>${e(periodLabel(p))}</div>`).join('')
                : `<div>${e(tf('rental_ended', 'Аренда закончилась'))}</div>`;
            return `<div class="text-sm opacity-70 mt-2 flex items-start gap-1">${icon}<div>${lines}</div></div>`;
        }

        // ==================== BUILDING MODAL ====================
        function populateBuildingTypeSelect() {
            const select = Layout.$('#buildingTypeSelect');
            select.innerHTML = `<option value="">—</option>` +
                buildingTypes.map(bt => `<option value="${bt.id}">${Layout.getName(bt)}</option>`).join('');
        }

        function toggleTemporaryDates() {
            const isTemporary = Layout.$('#isTemporaryCheckbox').checked;
            const section = Layout.$('#temporaryDatesSection');

            if (isTemporary) {
                section.classList.remove('hidden');
                toggleAlwaysAvailable(); // Update dates fields visibility
            } else {
                section.classList.add('hidden');
            }
        }

        function toggleAlwaysAvailable() {
            const alwaysAvailable = Layout.$('#alwaysAvailableCheckbox').checked;
            Layout.$('#datesInputSection').classList.toggle('hidden', alwaysAvailable);
        }

        // ---------- периоды аренды ----------
        const options07 = sel => [0, 1, 2, 3, 4, 5, 6, 7].map(n => `<option value="${n}"${n === sel ? ' selected' : ''}>${n}</option>`).join('');
        const trashIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;

        function addRentalRow(kind, p = {}) {
            const row = document.createElement('div');
            row.className = 'rental-row flex items-end gap-2';
            row.dataset.kind = kind;
            if (kind === 'dates') {
                row.innerHTML = `
                    <input type="date" class="input input-bordered input-sm flex-1 min-w-0" data-f="from" value="${e(p.date_from || '')}" />
                    <input type="date" class="input input-bordered input-sm flex-1 min-w-0" data-f="to" value="${e(p.date_to || '')}" />
                    <button type="button" class="btn btn-ghost btn-sm btn-square" data-rental-del>${trashIcon}</button>`;
            } else {
                // В выборе — ещё не закончившиеся ретриты и тот, что уже привязан
                const list = retreats.filter(r => r.end_date >= today() || r.id === p.retreat_id);
                row.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <select class="select select-bordered select-sm w-full" data-f="retreat">
                            <option value="">—</option>
                            ${list.map(r => `<option value="${r.id}"${r.id === p.retreat_id ? ' selected' : ''}>${e(Layout.getName(r))} · ${formatDate(r.start_date)} — ${formatDate(r.end_date)}</option>`).join('')}
                        </select>
                        <div class="text-xs opacity-60 mt-1" data-f="hint"></div>
                    </div>
                    <label class="text-xs opacity-70 flex flex-col items-center">${e(tf('rental_days_before', 'Дней до'))}
                        <select class="select select-bordered select-sm" data-f="before">${options07(p.days_before || 0)}</select></label>
                    <label class="text-xs opacity-70 flex flex-col items-center">${e(tf('rental_days_after', 'Дней после'))}
                        <select class="select select-bordered select-sm" data-f="after">${options07(p.days_after || 0)}</select></label>
                    <button type="button" class="btn btn-ghost btn-sm btn-square" data-rental-del>${trashIcon}</button>`;
                row.addEventListener('change', () => updateRetreatHint(row));
                updateRetreatHint(row);
            }
            Layout.$('#rentalPeriods').appendChild(row);
        }

        // Под ретритом — итоговые даты аренды с учётом дней до/после
        function updateRetreatHint(row) {
            const r = retreats.find(x => x.id === row.querySelector('[data-f="retreat"]').value);
            const hint = row.querySelector('[data-f="hint"]');
            if (!r) { hint.textContent = ''; return; }
            const shift = (iso, days) => { const d = DateUtils.parseDate(iso); d.setDate(d.getDate() + days); return DateUtils.toISO(d); };
            hint.textContent = `${formatDate(shift(r.start_date, -Number(row.querySelector('[data-f="before"]').value)))} — ${formatDate(shift(r.end_date, Number(row.querySelector('[data-f="after"]').value)))}`;
        }

        // Собрать периоды из формы; ошибка — текст, иначе массив
        function collectRentalRows() {
            const rows = [...Layout.$('#rentalPeriods').querySelectorAll('.rental-row')];
            const out = [];
            for (const row of rows) {
                if (row.dataset.kind === 'dates') {
                    const from = row.querySelector('[data-f="from"]').value, to = row.querySelector('[data-f="to"]').value;
                    if (!from && !to) continue;
                    if (!from || !to || to < from) return t('invalid_dates') === 'invalid_dates' ? 'Проверьте даты периода аренды' : t('invalid_dates');
                    out.push({ retreat_id: null, days_before: 0, days_after: 0, date_from: from, date_to: to });
                } else {
                    const retreatId = row.querySelector('[data-f="retreat"]').value;
                    if (!retreatId) continue;
                    const r = retreats.find(x => x.id === retreatId);
                    // Даты пересчитает триггер в базе; здесь — чтобы прошли NOT NULL
                    out.push({ retreat_id: retreatId, days_before: Number(row.querySelector('[data-f="before"]').value),
                        days_after: Number(row.querySelector('[data-f="after"]').value), date_from: r.start_date, date_to: r.end_date });
                }
            }
            return out;
        }

        // История: закончившиеся периоды и сколько людей жило в здании в эти даты
        async function renderRentalHistory(buildingId) {
            const box = Layout.$('#rentalHistory');
            box.classList.toggle('hidden', !pastPeriods.length);
            if (!pastPeriods.length) return;
            const list = Layout.$('#rentalHistoryList');
            const sorted = [...pastPeriods].sort((a, b) => b.date_from.localeCompare(a.date_from));
            list.innerHTML = sorted.map(p => `<div class="opacity-70">${e(periodLabel(p))}</div>`).join('');
            const { data, error } = await Layout.db.from('residents')
                .select('vaishnava_id, guest_name, check_in, check_out, rooms!inner(building_id)')
                .eq('rooms.building_id', buildingId)
                .neq('status', 'cancelled')
                .lte('check_in', sorted[0].date_to);
            if (error || editingBuildingId !== buildingId) { if (error) console.error('Error loading history:', error); return; }
            list.innerHTML = sorted.map(p => {
                const people = new Set((data || []).filter(r => r.check_in <= p.date_to && (r.check_out || '9999') >= p.date_from)
                    .map(r => r.vaishnava_id || r.guest_name || Math.random()));
                return `<div class="flex justify-between gap-2 opacity-70"><span>${e(periodLabel(p))}</span><span class="whitespace-nowrap">${people.size} ${e(tf('rental_guests', 'гостей'))}</span></div>`;
            }).join('');
        }

        function openBuildingModal(buildingId = null) {
            editingBuildingId = buildingId;
            const form = Layout.$('#buildingForm');
            const title = Layout.$('#buildingModalTitle');
            const deleteSection = Layout.$('#deleteBuildingSection');

            form.reset();
            populateBuildingTypeSelect();
            Layout.$('#rentalPeriods').innerHTML = '';
            pastPeriods = [];
            Layout.$('#rentalHistory').classList.add('hidden');
            Layout.$('#rentalHistory').open = false;

            if (buildingId) {
                const building = buildings.find(b => b.id === buildingId);
                if (building) {
                    title.textContent = t('edit_building');
                    form.id.value = building.id;
                    form.name_ru.value = building.name_ru || '';
                    form.name_en.value = building.name_en || '';
                    form.name_hi.value = building.name_hi || '';
                    form.building_type_id.value = building.building_type_id || '';
                    form.floors.value = building.floors || 1;
                    form.address.value = building.address || '';
                    form.description_ru.value = building.description_ru || '';
                    form.is_active.checked = building.is_active !== false;
                    form.is_temporary.checked = building.is_temporary || false;

                    // Действующие и будущие периоды — в форму, закончившиеся — в историю
                    const periods = building.building_rental_periods || [];
                    periods.filter(p => p.date_to >= today())
                        .sort((a, b) => a.date_from.localeCompare(b.date_from))
                        .forEach(p => addRentalRow(p.retreat_id ? 'retreat' : 'dates', p));
                    pastPeriods = periods.filter(p => p.date_to < today());
                    renderRentalHistory(building.id);

                    // «Доступно всегда» — временное здание без периодов
                    Layout.$('#alwaysAvailableCheckbox').checked = building.is_temporary && !periods.length;

                    deleteSection.classList.remove('hidden');
                }
            } else {
                title.textContent = t('add_building');
                deleteSection.classList.add('hidden');
                Layout.$('#alwaysAvailableCheckbox').checked = false;
            }
            if (!Layout.$('#rentalPeriods').children.length) addRentalRow('dates');

            toggleTemporaryDates();
            Layout.setupAutoTranslate('#buildingForm', ['name']);
            Layout.$('#buildingModal').showModal();
        }

        function closeBuildingModal() {
            Layout.$('#buildingModal').close();
            editingBuildingId = null;
        }

        async function saveBuilding(e) {
            e.preventDefault();
            const form = Layout.$('#buildingForm');
            const isTemporary = form.is_temporary.checked;
            const alwaysAvailable = Layout.$('#alwaysAvailableCheckbox').checked;

            const data = {
                name_ru: form.name_ru.value.trim(),
                name_en: form.name_en.value.trim() || null,
                name_hi: form.name_hi.value.trim() || null,
                building_type_id: form.building_type_id.value || null,
                floors: parseInt(form.floors.value) || 1,
                address: form.address.value.trim() || null,
                description_ru: form.description_ru.value.trim() || null,
                is_active: form.is_active.checked,
                is_temporary: isTemporary
                // available_from/available_until — охват периодов, ставит триггер (мигр. 723)
            };

            // Периоды аренды: нужны у временного здания, если оно не «доступно всегда»
            const periods = isTemporary && !alwaysAvailable ? collectRentalRows() : [];
            if (typeof periods === 'string') { Layout.showNotification(periods, 'error'); return; }
            if (isTemporary && !alwaysAvailable && !periods.length && !pastPeriods.length) {
                Layout.showNotification(tf('rental_need_period', 'Добавьте хотя бы один период аренды или отметьте «Доступно всегда»'), 'error');
                return;
            }

            try {
                let buildingId = editingBuildingId;
                if (editingBuildingId) {
                    const { error } = await Layout.db.from('buildings').update(data).eq('id', editingBuildingId);
                    if (error) throw error;
                } else {
                    const { data: created, error } = await Layout.db.from('buildings').insert(data).select('id');
                    if (error) throw error;
                    buildingId = created[0].id;
                }

                if (isTemporary) {
                    // Действующие периоды заменяем тем, что в форме; закончившиеся (история)
                    // не трогаем. «Доступно всегда» — периодов нет совсем
                    let del = Layout.db.from('building_rental_periods').delete().eq('building_id', buildingId);
                    if (!alwaysAvailable) del = del.gte('date_to', today());
                    const { error: delErr } = await del;
                    if (delErr) throw delErr;
                    if (periods.length) {
                        const { error: insErr } = await Layout.db.from('building_rental_periods')
                            .insert(periods.map(p => ({ ...p, building_id: buildingId })));
                        if (insErr) throw insErr;
                    }
                }

                Cache.invalidate('buildings'); Cache.invalidate('buildings_with_rooms'); Cache.invalidate('buildings_names');
                closeBuildingModal();
                buildings = await loadBuildings();
                render();
            } catch (err) {
                console.error('Error saving building:', err);
                Layout.showNotification(t('save_error') + ': ' + err.message, 'error');
            }
        }

        async function deleteBuilding() {
            if (!editingBuildingId) return;
            if (!confirm(t('delete_building_confirm'))) return;

            try {
                const { error } = await Layout.db.from('buildings').delete().eq('id', editingBuildingId);
                if (error) throw error;

                Cache.invalidate('buildings'); Cache.invalidate('buildings_with_rooms'); Cache.invalidate('buildings_names');
                closeBuildingModal();
                buildings = await loadBuildings();
                roomCounts = await loadRoomCounts();
                render();
            } catch (err) {
                console.error('Error deleting building:', err);
                Layout.showNotification(t('delete_error') + ': ' + err.message, 'error');
            }
        }

        // ==================== RENDER ====================
        function render() {
            renderBuildings();
        }

        function updateUI() {
            Layout.updateAllTranslations();
            render();
        }

        window.onLanguageChange = () => updateUI();

        // ==================== INIT ====================
        async function init() {
            await Layout.init({ module: 'housing', menuId: 'settings', itemId: 'buildings' });
            Layout.showLoader();

            // Загружаем базовые данные
            [buildingTypes, buildings, roomCounts, retreats] = await Promise.all([
                loadBuildingTypes(),
                loadBuildings(),
                loadRoomCounts(),
                loadRetreats()
            ]);

            // Forms
            Layout.$('#buildingForm').addEventListener('submit', saveBuilding);
            Layout.$('#isTemporaryCheckbox').addEventListener('change', toggleTemporaryDates);
            Layout.$('#alwaysAvailableCheckbox').addEventListener('change', toggleAlwaysAvailable);
            Layout.$('#buildingModal').addEventListener('click', ev => {
                const add = ev.target.closest('[data-rental-add]');
                if (add) addRentalRow(add.dataset.rentalAdd);
                const del = ev.target.closest('[data-rental-del]');
                if (del) del.closest('.rental-row').remove();
            });

            updateUI();
            Layout.hideLoader();
        }

        init();
    </script>
</body>
</html>
