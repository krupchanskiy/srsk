<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="../js/color-init.js?v=9"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="fin_page_title_payroll">Зарплатная ведомость — Финансы — ШРСК</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=29">
    <link rel="stylesheet" href="../css/fin.css?v=1">
</head>
<body class="fin-page bg-base-200 min-h-screen flex flex-col">

<div id="header-placeholder"></div>

<main class="container mx-auto px-4 py-6 flex-1">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
        <h1 class="text-2xl font-bold" data-i18n="fin_payroll_title">Зарплатная ведомость</h1>
    </div>

    <!-- Две ведомости на одной странице: преданные на окладе и наёмные рабочие со стороны (733) -->
    <div role="tablist" class="tabs tabs-boxed w-fit mb-4" id="payrollTabs">
        <a role="tab" class="tab tab-active" data-tab="salaried" data-i18n="fin_payroll_tab_salaried">Преданные на окладе</a>
        <a role="tab" class="tab" data-tab="hired" data-i18n="fin_payroll_tab_hired">Наёмные рабочие</a>
    </div>

    <section id="tabSalaried">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
            <select id="payrollRange" class="select select-bordered select-sm ml-auto">
                <option value="month" data-i18n="fin_payroll_range_month">Этот месяц</option>
                <option value="year" data-i18n="fin_payroll_range_year">Этот год</option>
                <option value="all" data-i18n="fin_payroll_range_all">За всё время</option>
            </select>
            <label class="label cursor-pointer gap-2">
                <input type="checkbox" id="showEnded" class="checkbox checkbox-sm">
                <span class="label-text" data-i18n="fin_payroll_show_ended">Показать завершённых</span>
            </label>
            <button type="button" id="runAccrualBtn" class="btn btn-outline btn-sm" data-i18n="fin_payroll_run_accrual">Начислить сейчас</button>
        </div>

        <div id="payrollConfirmWarn"></div>
        <div id="payrollBody"></div>
    </section>

    <section id="tabHired" class="hidden">
        <div class="flex flex-wrap items-center gap-3 mb-4">
            <select id="hiredMonth" class="select select-bordered select-sm"></select>
            <div id="hiredGrandTotal" class="text-sm"></div>
            <div class="ml-auto flex flex-wrap gap-2">
                <button type="button" id="hiredAddWorkerBtn" class="btn btn-outline btn-sm" data-i18n="fin_hired_add_worker">Добавить рабочего</button>
                <a href="gate.html" class="btn btn-primary btn-sm" data-i18n="nav_fin_gate">Оплаты с проходной</a>
            </div>
        </div>
        <div id="hiredBody"></div>
    </section>
</main>

<div id="footer-placeholder"></div>

<!-- Модалка выплаты (окладная или разовая) -->
<dialog id="payModal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-bold text-lg mb-4" id="payModalTitle"></h3>
        <form id="payForm">
            <input type="hidden" id="payPositionId">
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_payroll_amount">Сумма</span></label>
                <input type="number" id="payAmount" class="input input-bordered input-sm" min="0.01" step="0.01" required>
            </div>
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_payroll_date">Дата</span></label>
                <input type="date" id="payDate" class="input input-bordered input-sm" required>
            </div>
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_payroll_comment">Комментарий</span></label>
                <input type="text" id="payComment" class="input input-bordered input-sm">
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('payModal').close()" data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Модалка ручного начисления за месяц -->
<dialog id="accrueModal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-bold text-lg mb-4" id="accrueModalTitle"></h3>
        <form id="accrueForm">
            <input type="hidden" id="accruePositionId">
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_payroll_period">Месяц</span></label>
                <select id="accruePeriod" class="select select-bordered select-sm" required></select>
            </div>
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_payroll_amount">Сумма</span></label>
                <input type="number" id="accrueAmount" class="input input-bordered input-sm" min="0.01" step="0.01" required>
            </div>
            <p class="text-xs opacity-60" data-i18n="fin_payroll_accrue_hint"></p>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('accrueModal').close()" data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Наёмный рабочий: завести / изменить -->
<dialog id="workerModal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-bold text-lg mb-4" data-i18n="fin_hired_edit_worker">Рабочий</h3>
        <form id="workerForm">
            <input type="hidden" id="workerId">
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_hired_name">Имя</span></label>
                <input type="text" id="workerName" class="input input-bordered input-sm" required>
            </div>
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_hired_department">Департамент</span></label>
                <select id="workerDept" class="select select-bordered select-sm" required></select>
            </div>
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_hired_pay_kind">Оплата</span></label>
                <select id="workerKind" class="select select-bordered select-sm">
                    <option value="day" data-i18n="fin_hired_kind_day">Ставка за день</option>
                    <option value="month" data-i18n="fin_hired_kind_month">Оклад за месяц</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div class="form-control">
                    <label class="label py-0"><span class="label-text" data-i18n="fin_hired_rate">Оклад / ставка</span></label>
                    <input type="number" id="workerRate" class="input input-bordered input-sm" min="0.01" step="0.01">
                </div>
                <div class="form-control">
                    <label class="label py-0"><span class="label-text" data-i18n="fin_hired_hour_rate">Сверхурочный час</span></label>
                    <input type="number" id="workerHourRate" class="input input-bordered input-sm" min="0.01" step="0.01">
                </div>
            </div>
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_hired_note">Заметка</span></label>
                <input type="text" id="workerNote" class="input input-bordered input-sm">
            </div>
            <label class="label cursor-pointer justify-start gap-2" id="workerActiveWrap">
                <input type="checkbox" id="workerActive" class="checkbox checkbox-sm" checked>
                <span class="label-text" data-i18n="fin_hired_active">Работает</span>
            </label>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('workerModal').close()" data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="../js/config.js?v=5"></script>
<script src="../js/auth-check.js?v=17"></script>
<script src="../js/cache.js?v=2"></script>
<script src="../js/utils.js?v=23"></script>
<script src="../js/layout.js?v=125"></script>
<script src="../js/date-utils.js?v=5"></script>
<script src="../js/fin-utils.js?v=25"></script>
<script src="../js/pages/fin-payroll.js?v=16"></script>
<script src="../js/pages/fin-hired.js?v=2"></script>

</body>
</html>
