<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <script src="../js/color-init.js?v=2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="fin_page_title_analytics">Аналитика — Финансы — ШРСК</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=3">
    <link rel="stylesheet" href="../css/fin.css?v=1">
</head>
<body class="fin-page bg-base-200 min-h-screen flex flex-col">

<div id="header-placeholder"></div>

<main class="container mx-auto px-4 py-6 flex-1">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
        <h1 class="text-2xl font-bold" data-i18n="nav_fin_analytics">Аналитика</h1>
    </div>

    <div role="tablist" class="tabs tabs-boxed w-fit mb-4">
        <a role="tab" class="tab tab-active" data-tab="retreat" data-i18n="fin_analytics_retreat">По ретриту</a>
        <a role="tab" class="tab" data-tab="summary" data-i18n="fin_analytics_summary">Общая</a>
        <a role="tab" class="tab" data-tab="dept" data-i18n="fin_analytics_departments">По департаментам</a>
    </div>

    <!-- ===== ПО РЕТРИТУ ===== -->
    <div id="retreatTab">
        <div class="flex flex-wrap items-center gap-3 mb-4">
            <select id="retreatSelect" class="select select-bordered select-sm w-64"></select>
            <button class="btn btn-ghost btn-sm" id="csvBtn" onclick="FinAnalytics.exportCsv()" data-i18n="fin_export_csv">Выгрузить CSV</button>
        </div>

        <div id="retreatReport" class="space-y-4">
            <div class="text-center py-8 opacity-60" data-i18n="fin_select_retreat">Выберите ретрит</div>
        </div>
    </div>

    <!-- ===== ОБЩАЯ ===== -->
    <div id="summaryTab" class="hidden">
        <div class="flex flex-wrap items-end gap-3 mb-4">
            <div class="form-control">
                <label class="label py-0"><span class="label-text text-xs" data-i18n="fin_period_from">С</span></label>
                <input type="date" id="sumFrom" class="input input-bordered input-sm w-40">
            </div>
            <div class="form-control">
                <label class="label py-0"><span class="label-text text-xs" data-i18n="fin_period_to">По</span></label>
                <input type="date" id="sumTo" class="input input-bordered input-sm w-40">
            </div>
            <button class="btn btn-primary btn-sm" onclick="FinAnalytics.loadSummary()" data-i18n="fin_show">Показать</button>
        </div>
        <div id="summaryReport" class="space-y-4"></div>
    </div>

    <!-- ВКЛАДКА: ПО ДЕПАРТАМЕНТАМ -->
    <div id="deptTab" class="hidden">
        <div class="flex flex-wrap items-center gap-3 mb-4">
            <div class="fin-seg" role="group" id="deptPresets">
                <button type="button" data-dept-preset="week" data-i18n="fin_period_week">Неделя</button>
                <button type="button" data-dept-preset="month" data-i18n="fin_period_month">Месяц</button>
                <button type="button" data-dept-preset="year" data-i18n="fin_period_year">Год</button>
                <button type="button" data-dept-preset="custom" data-i18n="fin_period_custom">Выбрать</button>
            </div>
            <button class="btn btn-ghost btn-sm ml-auto gap-1" onclick="FinAnalytics.exportDeptCsv()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                <span data-i18n="fin_export_csv">CSV</span>
            </button>
        </div>

        <!-- Поля дат нужны только для своего диапазона: в остальных случаях они лишний шум -->
        <div id="deptCustomRange" class="hidden flex flex-wrap items-end gap-3 mb-4">
            <div class="form-control">
                <label class="label py-0" for="deptFrom"><span class="label-text text-xs" data-i18n="fin_period_from">С</span></label>
                <input type="date" id="deptFrom" class="input input-bordered input-sm w-40">
            </div>
            <div class="form-control">
                <label class="label py-0" for="deptTo"><span class="label-text text-xs" data-i18n="fin_period_to">По</span></label>
                <input type="date" id="deptTo" class="input input-bordered input-sm w-40">
            </div>
            <button class="btn btn-primary btn-sm" onclick="FinAnalytics.loadDepartments()" data-i18n="fin_show">Показать</button>
        </div>
        <div id="deptReport" class="space-y-4"></div>
    </div>
</main>

<style>
    /* ---------- Отчёт по департаментам ----------
       Три числа на департамент: получил, потратил, осталось. Полоса под названием
       даёт пропорцию — кто съедает бюджет, видно раньше, чем прочитаны цифры. */
    /* Переключатель периода: видно, какой выбран, без чтения полей с датами */
    .fin-seg {
        display: inline-flex; padding: 2px;
        background: rgba(15, 23, 42, 0.05);
        border-radius: 10px;
    }
    .fin-seg button {
        appearance: none; border: 0; background: transparent;
        padding: 0.3rem 0.85rem;
        border-radius: 8px;
        font-size: 0.8rem; font-weight: 500;
        color: var(--fin-muted);
        cursor: pointer;
        transition: background 0.15s ease-out, color 0.15s ease-out, box-shadow 0.15s ease-out;
    }
    .fin-seg button:hover { color: var(--fin-ink); }
    .fin-seg button.is-on {
        background: #fff;
        color: var(--fin-ink);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    }
    .fin-seg button:focus-visible { outline: 2px solid var(--fin-accent); outline-offset: 1px; }

    /* Шапка: за какой период отчёт и сколько департаментов учтено */
    .fin-dept-range {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem;
    }
    .fin-dept-range-dates {
        font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em;
        color: var(--fin-ink);
    }
    .fin-dept-range-count { font-size: 0.8rem; color: var(--fin-muted); }

    /* Выбор департаментов: чипы-переключатели, а не столбец галочек —
       их полтора десятка, столбец занял бы пол-экрана */
    .fin-dept-picker {
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem;
    }
    .fin-dept-chip {
        display: inline-flex; align-items: center; gap: 0.4rem;
        padding: 0.25rem 0.6rem 0.25rem 0.5rem;
        border: 1px solid var(--fin-border);
        border-radius: 999px;
        background: #fff;
        font-size: 0.8rem;
        color: var(--fin-muted);
        cursor: pointer;
        user-select: none;
        transition: border-color 0.15s ease-out, color 0.15s ease-out, background 0.15s ease-out;
    }
    .fin-dept-chip:hover { border-color: color-mix(in srgb, var(--fin-accent) 40%, var(--fin-border)); }
    .fin-dept-chip.is-on {
        color: var(--fin-ink);
        border-color: color-mix(in srgb, var(--fin-accent) 45%, transparent);
        background: color-mix(in srgb, var(--fin-accent) 7%, #fff);
    }
    .fin-dept-chip input {
        appearance: none; -webkit-appearance: none;
        width: 0.85rem; height: 0.85rem; margin: 0;
        border: 1.5px solid var(--fin-muted); border-radius: 4px;
        display: grid; place-content: center;
        cursor: pointer;
    }
    .fin-dept-chip input:checked {
        background: var(--fin-accent); border-color: var(--fin-accent);
    }
    .fin-dept-chip input:checked::after {
        content: ''; width: 0.5rem; height: 0.28rem;
        border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
        transform: rotate(-45deg) translate(0.02rem, -0.05rem);
    }
    .fin-dept-chip input:focus-visible { outline: 2px solid var(--fin-accent); outline-offset: 2px; }
    .fin-dept-picker-actions { display: inline-flex; gap: 0.1rem; margin-left: 0.25rem; }
    .fin-dept-picker-idle {
        width: 100%; font-size: 0.72rem; color: var(--fin-muted); margin-top: 0.1rem;
    }

    .fin-dept-totals {
        display: grid; gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .fin-dept-kpi {
        display: flex; flex-direction: column; gap: 0.2rem;
        padding: 0.9rem 1.1rem;
        background: #fff;
        border: 1px solid var(--fin-border);
        border-radius: 14px;
        box-shadow: var(--fin-shadow);
    }
    .fin-dept-kpi-label {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
        font-weight: 600; color: var(--fin-muted);
    }
    .fin-dept-kpi-value {
        font-size: 1.5rem; font-weight: 700; letter-spacing: -0.015em;
        font-variant-numeric: tabular-nums; color: var(--fin-ink);
    }

    .fin-dept-head, .fin-dept-row {
        display: grid;
        grid-template-columns: minmax(11rem, 1fr) 8.5rem 8.5rem 8.5rem;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 1.1rem;
    }
    .fin-dept-head {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em;
        font-weight: 600; color: var(--fin-muted);
        border-bottom: 1px solid var(--fin-border);
        padding-top: 0.85rem; padding-bottom: 0.55rem;
    }
    .fin-dept-row + .fin-dept-row { border-top: 1px solid var(--fin-border); }
    .fin-dept-row:hover { background: rgba(15, 23, 42, 0.015); }

    .fin-dept-name { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .fin-dept-bar {
        display: block; height: 4px; border-radius: 2px;
        background: rgba(15, 23, 42, 0.07); overflow: hidden;
    }
    .fin-dept-bar > span {
        display: block; height: 100%; border-radius: 2px;
        background: var(--fin-accent);
    }
    .fin-dept-note { font-size: 0.7rem; color: var(--fin-muted); }
    .fin-dept-num {
        text-align: right; white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        font-size: 0.875rem;
    }

    /* Статьи — вторая строка сетки: на что именно ушли деньги департамента */
    .fin-dept-cats {
        grid-column: 1 / -1;
        display: flex; flex-wrap: wrap; gap: 0.35rem;
        margin-top: 0.1rem;
    }
    .fin-dept-cat {
        font-size: 0.72rem; line-height: 1.6;
        padding: 0 0.5rem; border-radius: 6px;
        background: rgba(15, 23, 42, 0.05); color: var(--fin-muted);
        white-space: nowrap;
    }
    .fin-dept-cat b { color: var(--fin-ink); font-variant-numeric: tabular-nums; }

    /* На узком экране каждое число — своя строка «подпись → значение» */
    @media (max-width: 760px) {
        .fin-dept-head { display: none; }
        .fin-dept-row { grid-template-columns: 1fr; row-gap: 0.15rem; }
        .fin-dept-name { margin-bottom: 0.25rem; }
        .fin-dept-num {
            display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
        }
        .fin-dept-num::before {
            content: attr(data-label);
            font-family: 'Noto Sans', system-ui, sans-serif;
            font-size: 0.75rem; color: var(--fin-muted);
        }
        .fin-dept-cats { margin-top: 0.4rem; }
    }
</style>

<div id="footer-placeholder"></div>

<!-- Модалка: закрыть ретрит -->
<dialog id="closeModal" class="modal">
    <div class="modal-box max-w-md">
        <h3 class="font-bold text-lg mb-2" data-i18n="fin_close_retreat">Закрыть ретрит</h3>
        <p class="text-sm opacity-70 mb-3" data-i18n="fin_close_warning">После закрытия новые операции по ретриту возможны только как post-close с обязательной причиной. Убедитесь, что долги отработаны или осознанно зафиксированы.</p>
        <div id="closeInfo" class="text-sm mb-3"></div>
        <div class="modal-action">
            <button type="button" class="btn" onclick="document.getElementById('closeModal').close()" data-i18n="cancel">Отмена</button>
            <button type="button" class="btn btn-error" onclick="FinAnalytics.submitClose()" data-i18n="fin_close_retreat">Закрыть ретрит</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Модалка: перевыпуск -->
<dialog id="reissueModal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-bold text-lg mb-2" data-i18n="fin_reissue">Перевыпустить отчёт</h3>
        <form id="reissueForm">
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_reason">Причина</span></label>
                <input type="text" id="reissueReason" class="input input-bordered input-sm" required>
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('reissueModal').close()" data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="fin_reissue">Перевыпустить отчёт</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="../js/config.js?v=5"></script>
<script src="../js/auth-check.js?v=10"></script>
<script src="../js/cache.js?v=1"></script>
<script src="../js/utils.js?v=12"></script>
<script src="../js/layout.js?v=69"></script>
<script src="../js/date-utils.js?v=4"></script>
<script src="../js/fin-utils.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="../js/pages/fin-analytics.js?v=8"></script>

</body>
</html>
