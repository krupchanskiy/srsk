<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <script src="../js/color-init.js?v=2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="fin_page_title_inbox">Входящие — Финансы — ШРСК</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=3">
    <link rel="stylesheet" href="../css/fin.css?v=1">
</head>
<body class="fin-page bg-base-200 min-h-screen flex flex-col">

<div id="header-placeholder"></div>

<main class="container mx-auto px-4 py-6 flex-1">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
        <h1 class="text-2xl font-bold" data-i18n="nav_fin_inbox">Входящие</h1>
    </div>

    <div role="tablist" class="tabs tabs-boxed w-fit mb-4">
        <a role="tab" class="tab tab-active" data-tab="pending"><span data-i18n="fin_tab_pending">Не проверено</span>&nbsp;<span class="badge badge-warning badge-sm" id="pendingTabCount">0</span></a>
        <a role="tab" class="tab" data-tab="disputed"><span data-i18n="fin_tab_disputed">Оспоренные</span>&nbsp;<span class="badge badge-error badge-sm" id="disputedTabCount">0</span></a>
        <a role="tab" class="tab" data-tab="unposted"><span data-i18n="fin_tab_unposted">Не разнеслись</span>&nbsp;<span class="badge badge-error badge-sm" id="unpostedTabCount">0</span></a>
        <a role="tab" class="tab" data-tab="chat_drafts"><span data-i18n="fin_tab_chat_drafts">Из чатов</span>&nbsp;<span class="badge badge-warning badge-sm" id="chatDraftsTabCount">0</span></a>
        <a role="tab" class="tab" data-tab="unfinished"><span data-i18n="fin_tab_unfinished">Ждут ответа</span>&nbsp;<span class="badge badge-ghost badge-sm" id="unfinishedTabCount">0</span></a>
    </div>

    <div id="inboxList" class="space-y-3">
        <div class="text-center py-8"><span class="loading loading-spinner loading-md"></span></div>
    </div>
</main>

<div id="footer-placeholder"></div>

<!-- Модалка: оспорить -->
<dialog id="disputeModal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-bold text-lg mb-2" data-i18n="fin_dispute">Оспорить</h3>
        <div class="text-sm opacity-70 mb-3" id="disputeInfo"></div>
        <form id="disputeForm">
            <input type="hidden" id="disputeOpId">
            <input type="hidden" id="disputeExpected">
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_dispute_reason">Причина спора</span></label>
                <input type="text" id="disputeReason" class="input input-bordered input-sm" required>
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('disputeModal').close()" data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-error" data-i18n="fin_dispute">Оспорить</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Модалка: сторно -->
<dialog id="reversalModal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-bold text-lg mb-2" data-i18n="fin_reversal">Сторно</h3>
        <div class="text-sm opacity-70 mb-3" id="revInfo"></div>
        <form id="reversalForm">
            <input type="hidden" id="revOpId">
            <div class="form-control mb-2">
                <label class="label py-0"><span class="label-text" data-i18n="fin_reason">Причина</span></label>
                <input type="text" id="revReason" class="input input-bordered input-sm" required>
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('reversalModal').close()" data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-error" data-i18n="fin_reverse">Сторнировать</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Модалка: статьи заявки из чата. Одна строка с другой статьёй = «поменять
     статью», несколько строк = «разбить чек». Сумма строк обязана сойтись. -->
<dialog id="splitModal" class="modal">
    <div class="modal-box max-w-3xl">
        <h3 class="font-bold text-lg mb-1" data-i18n="fin_split_title">Статьи расхода</h3>
        <div class="text-sm opacity-70 mb-3" id="splitInfo"></div>
        <form id="splitForm">
            <input type="hidden" id="splitDraftId">
            <!-- Откуда ушли деньги: по умолчанию подотчёт департамента-автора,
                 но казначей может указать кассу (просьба ВГ 05.08.2026) -->
            <label class="form-control mb-3">
                <span class="label-text font-medium" data-i18n="fin_split_source">Списать со счёта</span>
                <select id="splitSource" class="select select-bordered select-sm w-full"></select>
            </label>
            <div id="splitRows" class="flex flex-col gap-2"></div>
            <div class="flex gap-2 mt-2">
                <button type="button" class="btn btn-ghost btn-sm" id="splitAddRow"
                        data-i18n="fin_split_add">+ Ещё строка</button>
                <button type="button" class="btn btn-ghost btn-sm" id="splitEven"
                        data-i18n="fin_split_evenly">Поровну</button>
            </div>
            <div class="text-sm mt-3" id="splitRemainder"></div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('splitModal').close()"
                        data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-success" id="splitSubmit"
                        data-i18n="fin_post_draft">Провести</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Модалка: уточнение выдачи. Бот угадывает получателя по тексту и ошибается —
     казначей правит адресацию, не трогая сумму и текст заявки. -->
<dialog id="refineModal" class="modal">
    <div class="modal-box max-w-md">
        <h3 class="font-bold text-lg mb-1" data-i18n="fin_refine_title">Уточнить выдачу</h3>
        <div class="text-sm opacity-70 mb-3" id="refineInfo"></div>
        <form id="refineForm">
            <input type="hidden" id="refineDraftId">
            <label class="form-control">
                <div class="label"><span class="label-text" data-i18n="fin_refine_target">Кому выдаём</span></div>
                <select class="select select-bordered" id="refineTarget" required></select>
            </label>
            <label class="form-control mt-2">
                <div class="label"><span class="label-text" data-i18n="fin_refine_source">С какого счёта</span></div>
                <select class="select select-bordered" id="refineSource"></select>
            </label>
            <label class="label cursor-pointer justify-start gap-2 mt-3">
                <input type="checkbox" class="checkbox checkbox-sm" id="refineSpent">
                <span class="label-text" data-i18n="fin_refine_spent">Деньги уже потрачены — сразу учесть как расход получателя</span>
            </label>
            <div id="refineSpentFields" class="hidden flex flex-col gap-2 pl-6">
                <select class="select select-bordered select-sm" id="refineCategory"></select>
                <select class="select select-bordered select-sm" id="refineObject"></select>
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('refineModal').close()"
                        data-i18n="cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" id="refineSubmit"
                        data-i18n="save">Сохранить</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="../js/config.js?v=5"></script>
<script src="../js/auth-check.js?v=10"></script>
<script src="../js/cache.js?v=1"></script>
<script src="../js/utils.js?v=12"></script>
<script src="../js/layout.js?v=69"></script>
<script src="../js/date-utils.js?v=4"></script>
<script src="../js/fin-utils.js?v=11"></script>
<script src="../js/pages/fin-inbox.js?v=18"></script>

</body>
</html>
