<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=2"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="bookings_page_title">Бронирования — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=6">
    <style>
        .calendar-day {
            min-height: 100px;
        }
        .calendar-day.other-month {
            opacity: 0.4;
        }
        .calendar-day.today {
            background: oklch(var(--p) / 0.1);
        }
        .booking-count {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .floor-plan-container { position: relative; }
        .floor-plan-svg { pointer-events: all; }
        .room-label {
            font-size: 2px;
            fill: white;
            text-anchor: middle;
            dominant-baseline: middle;
            font-weight: 600;
            text-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1">

        <!-- CRM back link (только при прямом открытии, не в iframe) -->
        <div id="crmBackBar" class="hidden mb-4">
            <a id="crmBackLink" href="#" class="btn btn-ghost btn-sm gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                <span data-i18n="back_to_deal">Вернуться к сделке</span>
            </a>
        </div>

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-bold" data-i18n="bookings_title">Бронирования</h1>
                <!-- View toggle -->
                <div class="tabs tabs-boxed bg-base-100">
                    <button class="tab tab-active gap-2" id="viewListBtn" onclick="setView('list')">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                        <span data-i18n="view_list">Список</span>
                    </button>
                    <button class="tab gap-2" id="viewCalendarBtn" onclick="setView('calendar')">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span data-i18n="view_calendar">Календарь</span>
                    </button>
                </div>
            </div>
            <!-- «Забронировать» → человек или семья (один номер) или группа — одно окно js/group-booking.js (ВГ, 08.10) -->
            <div class="dropdown dropdown-end" data-permission="create_booking">
                <div tabindex="0" role="button" class="btn btn-primary gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span data-i18n="add_booking">Забронировать</span>
                </div>
                <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-10 w-56 p-2 shadow">
                    <li><a onclick="document.activeElement.blur(); openPersonBooking()" data-i18n="timeline_booking_person">Человек или семья</a></li>
                    <li><a onclick="document.activeElement.blur(); openGroupBooking()" data-i18n="timeline_booking_group">Группа</a></li>
                </ul>
            </div>
        </div>

        <!-- Filters (only for list view) -->
        <div class="mb-6" id="filtersBlock">
            <div class="tabs tabs-boxed bg-base-100 inline-flex">
                <button class="tab tab-active" data-filter="all" onclick="setFilter('all')" data-i18n="bookings_filter_all">Все</button>
                <button class="tab" data-filter="checked_in" onclick="setFilter('checked_in')" data-i18n="bookings_filter_checked_in">Заселены</button>
                <button class="tab" data-filter="not_checked_in" onclick="setFilter('not_checked_in')" data-i18n="bookings_filter_not_checked_in">Не заселились</button>
                <button class="tab" data-filter="upcoming" onclick="setFilter('upcoming')" data-i18n="bookings_filter_upcoming">Предстоящие</button>
                <button class="tab" data-filter="past" onclick="setFilter('past')" data-i18n="bookings_filter_past">Прошедшие</button>
                <!-- брони без мест в шахматке; в нормальной работе пусто (ВГ, 29.09) -->
                <button class="tab" data-filter="attention" onclick="setFilter('attention')">⚠&nbsp;<span data-i18n="bookings_filter_attention">Требуют внимания</span><span class="tab-count"></span></button>
            </div>
        </div>

        <!-- List View -->
        <div id="listView">
            <!-- Bookings List -->
            <div id="bookingsList" class="space-y-4">
                <!-- Will be generated by JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="text-lg opacity-60" data-i18n="bookings_empty">Нет бронирований</p>
                <button class="btn btn-primary mt-4" onclick="openPersonBooking()" data-permission="create_booking" data-i18n="add_booking">Забронировать</button>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="calendarView" class="hidden bg-base-100 rounded-lg shadow-sm overflow-hidden">
            <!-- Calendar navigation -->
            <div class="p-4 border-b border-base-200 flex items-center justify-between">
                <button class="btn btn-ghost btn-sm" onclick="prevMonth()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <h2 class="font-semibold text-lg" id="calendarTitle">Январь 2025</h2>
                <button class="btn btn-ghost btn-sm" onclick="nextMonth()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>

            <!-- Calendar grid -->
            <div class="p-4">
                <!-- Week days header -->
                <div class="grid grid-cols-7 gap-1 mb-2">
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_mon">Пн</div>
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_tue">Вт</div>
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_wed">Ср</div>
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_thu">Чт</div>
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_fri">Пт</div>
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_sat">Сб</div>
                    <div class="text-center text-sm font-medium opacity-60 py-2" data-i18n="weekday_sun">Вс</div>
                </div>

                <!-- Calendar days -->
                <div class="grid grid-cols-7 gap-1" id="calendarGrid">
                    <!-- Days will be rendered here -->
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>


    <!-- Booking Details Modal -->
    <dialog id="bookingModal" class="modal">
        <div class="modal-box max-w-lg relative">
            <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="closeBookingModal()">✕</button>
            <h3 class="font-bold text-lg mb-4" id="bookingModalTitle" data-i18n="booking_details">Детали брони</h3>

            <div id="bookingModalContent" class="space-y-4">
                <!-- Will be generated by JS -->
            </div>

            <div class="modal-action">
                <button type="button" class="btn btn-ghost btn-sm text-error gap-1" onclick="deleteBookingPermanently()" data-permission="delete_booking">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span data-i18n="delete">Удалить</span>
                </button>
                <button type="button" class="btn btn-ghost btn-error gap-1" onclick="cancelBooking()" data-permission="delete_booking">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    <span data-i18n="booking_cancel">Отменить</span>
                </button>
                <button type="button" class="btn btn-outline" onclick="openGroupBooking(selectedBookingId)" data-permission="create_booking" data-i18n="booking_rooms_seats">Расселение группы</button>
                <button type="button" class="btn btn-ghost" onclick="closeBookingModal()" data-i18n="close">Закрыть</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Day Details Modal (for calendar) -->
    <dialog id="dayModal" class="modal">
        <div class="modal-box max-w-lg relative">
            <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="closeDayModal()">✕</button>
            <h3 class="font-bold text-lg mb-4" id="dayModalTitle" data-i18n="bookings_title">Бронирования</h3>

            <div id="dayModalContent" class="space-y-3">
                <!-- Bookings will be rendered here -->
            </div>

            <div class="modal-action">
                <button type="button" class="btn btn-ghost" onclick="closeDayModal()" data-i18n="close">Закрыть</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>


    <script src="../js/config.js?v=5"></script>
    <script src="../js/auth-check.js?v=13"></script>
    <script src="../js/permissions-ui.js?v=2"></script>
    <script src="../js/cache.js?v=1"></script>
    <script src="../js/utils.js?v=13"></script>
    <script src="../js/translit.js"></script>
    <script src="../js/auto-translate.js"></script>
    <script src="../js/date-utils.js?v=4"></script>
    <script src="../js/layout.js?v=84"></script>
    <script src="../js/retreat-select.js?v=1"></script>
    <script src="../js/house-guard.js?v=1"></script>
    <script src="../js/group-booking.js?v=11"></script>
    <script src="../js/pages/bookings.js?v=13"></script>
</body>
</html>
