<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — AB Kitchen</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
    <main class="card bg-base-100 shadow-xl w-full max-w-md">
        <form id="loginForm" class="card-body">
            <div class="text-center mb-3">
                <h1 class="text-3xl font-bold">AB Kitchen</h1>
                <p class="opacity-60 mt-1">Кухня Ашрама Бхактиведанты</p>
            </div>

            <div id="errorBox" class="alert alert-error hidden" role="alert"></div>

            <label class="form-control">
                <span class="label-text mb-1">Email</span>
                <input id="email" name="email" type="email" autocomplete="username"
                       class="input input-bordered w-full" required>
            </label>

            <label class="form-control mt-3">
                <span class="label-text mb-1">Пароль</span>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       class="input input-bordered w-full" required>
            </label>

            <button id="submitButton" type="submit" class="btn btn-primary mt-6">Войти</button>
            <button id="resetPasswordButton" type="button" class="btn btn-ghost btn-sm mt-1">Забыли пароль?</button>
            <div id="successBox" class="alert alert-success hidden mt-2" role="status"></div>
            <p class="text-xs opacity-55 text-center mt-3">
                Вход разрешён только администраторам AB Kitchen.
            </p>
        </form>
    </main>

    <script src="/js/config.js"></script>
    <script>
        try { sessionStorage.setItem('srsk_ab_kitchen_context', '1'); } catch {}

        const form = document.getElementById('loginForm');
        const button = document.getElementById('submitButton');
        const resetButton = document.getElementById('resetPasswordButton');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');

        function showError(message) {
            successBox.classList.add('hidden');
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        const reason = new URLSearchParams(window.location.search).get('reason');
        if (reason === 'account_pending') {
            showError('Аккаунт ещё не одобрен администратором AB Kitchen.');
        }

        resetButton.addEventListener('click', async () => {
            const email = form.email.value.trim();
            if (!email) {
                showError('Сначала укажите email, для которого нужно восстановить пароль.');
                form.email.focus();
                return;
            }

            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');
            resetButton.disabled = true;
            resetButton.textContent = 'Отправляем…';
            try {
                const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://in.rupaseva.com/reset-password/'
                });
                if (error) throw error;
                successBox.textContent = 'Ссылка для смены пароля отправлена. После смены пароля вернитесь в AB Kitchen.';
                successBox.classList.remove('hidden');
            } catch (error) {
                console.error('Password reset failed:', error);
                showError('Не удалось отправить ссылку. Подождите минуту и попробуйте снова.');
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = 'Забыли пароль?';
            }
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');
            button.disabled = true;
            button.textContent = 'Входим…';

            try {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: form.email.value.trim(),
                    password: form.password.value
                });
                if (error || !data.session) throw error || new Error('Сессия не создана');

                const { data: hasAccess, error: accessError } = await window.supabaseClient.rpc('has_ab_kitchen_access');
                if (accessError || hasAccess !== true) {
                    await window.supabaseClient.auth.signOut();
                    showError('Для этого аккаунта не назначен доступ администратора AB Kitchen.');
                    return;
                }

                window.location.replace('/kitchen/menu.html');
            } catch (error) {
                console.error('Login failed:', error);
                showError('Неверный email или пароль. Проверьте данные и повторите попытку.');
            } finally {
                button.disabled = false;
                button.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
