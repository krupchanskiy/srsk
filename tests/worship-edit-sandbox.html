<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Песочница редактора стандартов</title>
    <!--
      Редактор живёт за авторизацией, и проверять его правки «вживую» значит
      каждый раз входить в боевую систему. Эта страница подменяет всё внешнее
      заглушками (база, права, перевод) и поднимает тот же самый редактор
      на выдуманной статье — чтобы проверять поведение: откат, блоки, вставку.

      Открывать локально: npm run serve → /tests/worship-edit-sandbox.html
      В прод не попадает ничего: страница лежит в tests/.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --current-color: #6b4226; }
        #текст { outline: none; font-size: 17px; line-height: 1.75; min-height: 40vh; }
        #текст p { margin: 0 0 .75em; }
        #текст h2 { font-size: 22px; font-weight: 700; margin: 1.2em 0 .5em; }
        #текст h3 { font-size: 18px; font-weight: 600; margin: 1em 0 .4em; }
        #текст ul { list-style: disc; padding-left: 1.6em; }
        #текст ol { list-style: decimal; padding-left: 1.6em; }
        #текст blockquote { background: #eee; border-radius: .75rem; padding: .7rem 1rem; }
    </style>
</head>
<body class="bg-base-200 p-6">

<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-1">Песочница редактора</h1>
    <p class="text-sm opacity-60 mb-4">Без входа и без базы. Кнопка внизу прогоняет проверки сама.</p>

    <div id="возврат" hidden><div id="возвратПричина"></div></div>
    <div id="конфликт" hidden><span id="чужойАвтор"></span><button id="перезаписать"></button>
        <button id="открытьЧужое"></button></div>
    <div class="mb-2 flex gap-3 items-center">
        <span id="режим" class="badge"></span>
        <select id="раздел" class="select select-sm select-bordered"></select>
        <span id="сохранение" class="text-sm"></span>
    </div>
    <label class="form-control mb-2">
        <input id="заголовок" type="text" class="input input-bordered" placeholder="Название">
    </label>
    <label class="form-control mb-3" id="картаИзменений">
        <input id="примечание" type="text" class="input input-bordered input-sm" placeholder="Что изменилось">
    </label>

    <div class="sticky top-0 z-20 mb-3 flex flex-wrap items-center gap-1 bg-base-200/95 py-2">
        <div class="join mr-1">
            <button class="btn btn-sm btn-outline join-item px-2" id="откатить" title="Ctrl+Z">↶</button>
            <button class="btn btn-sm btn-outline join-item px-2" id="повторить" title="Ctrl+Shift+Z">↷</button>
        </div>
        <button class="btn btn-sm btn-outline font-bold px-3" id="жирный">Ж</button>
        <button class="btn btn-sm btn-outline" data-стиль="h2">Заголовок</button>
        <button class="btn btn-sm btn-outline" data-стиль="h3">Подзаголовок</button>
        <button class="btn btn-sm btn-outline px-3" id="список">• Список</button>
        <button class="btn btn-sm btn-outline px-3" id="поШагам">1. По шагам</button>
        <button class="btn btn-sm btn-outline" data-стиль="note">Заметка</button>
        <button class="btn btn-sm btn-outline" id="ссылка">Ссылка</button>
        <div class="dropdown">
            <button tabindex="0" class="btn btn-sm btn-outline">Фото</button>
            <ul tabindex="0" class="dropdown-content z-30 menu menu-sm p-2 shadow bg-base-100 rounded-box w-56">
                <li><button id="фотоФайл">Загрузить с устройства</button></li>
                <li><button id="фотоГалерея">Взять из галереи</button></li>
            </ul>
        </div>
        <button class="btn btn-sm btn-ghost ml-auto" id="убратьОформление">Очистить</button>
    </div>

    <div class="card bg-base-100 shadow"><div class="card-body p-6">
        <div id="текст" contenteditable="true" spellcheck="true"></div>
    </div></div>

    <div class="flex gap-2 mt-4">
        <button class="btn btn-sm" id="сохранить">Сохранить</button>
        <button class="btn btn-sm" id="отправить">Отправить</button>
        <button class="btn btn-sm" id="отмена">Отмена</button>
        <button class="btn btn-sm" id="удалить">Удалить</button>
        <button class="btn btn-sm btn-primary ml-auto" id="прогон">Прогнать проверки</button>
    </div>
    <div id="тегиБлок" hidden><div id="теги"></div></div>
    <input type="file" id="файл" hidden>
    <dialog id="галереяМодал" class="modal"><div class="modal-box">
        <select id="выборНабора"></select><div id="снимкиНабора"></div></div></dialog>

    <pre id="итоги" class="mt-4 bg-base-100 rounded-box p-4 text-sm whitespace-pre-wrap"></pre>
</div>

<script src="../js/utils.js?v=14"></script>
<script src="../js/worship-doc.js"></script>
<script src="../js/worship-editor-doc.js"></script>
<script>
// ───────── заглушки внешнего мира ─────────
const пусто = { data: null, error: null };
const цепочка = данные => {
    const о = {};
    ['select', 'eq', 'in', 'order', 'limit', 'gte', 'lte', 'or', 'not'].forEach(м => о[м] = () => о);
    о.maybeSingle = () => Promise.resolve({ data: данные.одна ?? null, error: null });
    о.then = (вперёд) => Promise.resolve({ data: данные.много ?? [], error: null }).then(вперёд);
    return о;
};

window.Layout = {
    t: k => k,
    escapeHtml: s => Utils.escapeHtml(String(s ?? '')),
    getName: о => о?.name_ru || '',
    showNotification: (т, в) => console.log('[уведомление]', в || '', т),
    handleError: (о, г) => console.error('[ошибка]', г, о),
    debounce: (f, мс) => { let т; return (...а) => { clearTimeout(т); т = setTimeout(() => f(...а), мс); }; },
    pluralize: (n, ф) => `${n} ${(ф.ru || [])[0] || ''}`,
    db: {
        from: имя => цепочка(имя === 'worship_sections'
            ? { много: [{ id: 'раздел-1', name_ru: 'Арати', is_active: true }] }
            : { много: [], одна: null }),
        storage: { from: () => ({ remove: () => Promise.resolve({ error: null }),
                                  createSignedUrls: () => Promise.resolve({ data: [], error: null }) }) },
        rpc: () => Promise.resolve({ data: null, error: null }),
    },
};
window.currentUser = { id: 'я', is_superuser: true };
window.hasPermission = () => true;
window.WorshipTags = { нарисовать: () => {} };
</script>
<script src="../js/pages/worship-edit.js"></script>
<script>
// ───────── проверки ─────────
const итоги = [];
const скажи = (имя, ок, что = '') => итоги.push(`${ок ? '✓' : '✗'} ${имя}${что ? ' — ' + что : ''}`);
const пауза = мс => new Promise(r => setTimeout(r, мс));
const поле = () => document.querySelector('#текст');
const документ = () => WorshipDoc.разобрать(WorshipEditorDoc.изДома(поле()));
const типы = () => документ().blocks.map(б => б.type).join(',');

function выделить(узел) {
    const д = document.createRange();
    д.selectNodeContents(узел);
    const в = getSelection();
    в.removeAllRanges();
    в.addRange(д);
    поле().focus();
}

function вставитьТекст(строка) {
    поле().focus();
    document.execCommand('insertText', false, строка);
    поле().dispatchEvent(new InputEvent('input', { bubbles: true }));
}

async function прогон() {
    итоги.length = 0;
    поле().innerHTML = '<p>Мангала-арати начинается в 4:30</p>';

    // 1. текст читается как документ
    скажи('абзац читается как абзац', типы() === 'p', типы());

    // 2. выделили абзац → заголовок
    выделить(поле().querySelector('p'));
    document.querySelector('[data-стиль="h2"]').click();
    await пауза(150);
    скажи('выделенное становится заголовком', типы() === 'h2', типы());

    // 3. повторное нажатие снимает заголовок
    document.querySelector('[data-стиль="h2"]').click();
    await пауза(150);
    скажи('повторное нажатие возвращает абзац', типы() === 'p', типы());

    // 4. список
    выделить(поле().firstElementChild);
    document.querySelector('#список').click();
    await пауза(150);
    скажи('выделенное становится списком', типы() === 'ul', типы());
    document.querySelector('#список').click();
    await пауза(150);

    // 5. заметка
    выделить(поле().firstElementChild);
    document.querySelector('[data-стиль="note"]').click();
    await пауза(150);
    скажи('выделенное становится заметкой', типы() === 'note', типы());
    document.querySelector('[data-стиль="note"]').click();
    await пауза(150);

    // 6. жирный сохраняется в документе
    выделить(поле().firstElementChild);
    document.querySelector('#жирный').click();
    await пауза(150);
    const жирное = документ().blocks[0]?.spans?.some(о => о.b);
    скажи('жирный доезжает до документа', !!жирное);

    // 7. отмена — браузерная, без своей истории
    const доОтмены = поле().innerHTML;
    document.querySelector('#откатить').click();
    await пауза(250);
    скажи('Ctrl+Z отменяет последнее действие', поле().innerHTML !== доОтмены,
        `было «${доОтмены.slice(0, 40)}», стало «${поле().innerHTML.slice(0, 40)}»`);

    // 8. повтор возвращает
    document.querySelector('#повторить').click();
    await пауза(250);
    скажи('Ctrl+Shift+Z возвращает', поле().innerHTML === доОтмены,
        поле().innerHTML.slice(0, 50));

    // 9. вставка готового текста разбирается на части
    поле().innerHTML = '<p><br></p>';
    выделить(поле().firstElementChild);
    const кусок = ['Утреннее одевание', '', 'Одевают в такой последовательности.', '',
                   '1. Нижняя одежда', '2. Верхняя одежда', '', '— Проверить гирлянду'].join('\n');
    поле().dispatchEvent(Object.assign(new Event('paste', { bubbles: true, cancelable: true }), {
        clipboardData: { getData: () => кусок },
    }));
    await пауза(250);
    const после = типы();
    скажи('вставка делится на заголовок, абзац и списки',
        после.includes('h2') && после.includes('ol') && после.includes('ul'), после);

    // 10. документ переживает круг «в разметку и обратно»
    const был = JSON.stringify(документ());
    поле().replaceChildren(WorshipEditorDoc.вДом(JSON.parse(был)));
    скажи('документ не портится при переводе туда и обратно',
        JSON.stringify(документ()) === был);

    // 11. чужая вёрстка не доезжает до документа
    поле().innerHTML = '<p>Текст <span style="color:red" class="чужое">с цветом</span></p>' +
        '<table><tr><td>таблица</td></tr></table>';
    const чистый = JSON.stringify(документ());
    скажи('чужая вёрстка превращается в обычный текст',
        !чистый.includes('color') && !чистый.includes('table'), чистый.slice(0, 80));

    document.querySelector('#итоги').textContent = итоги.join('\n');
    console.log(итоги.join('\n'));
    return итоги;
}

document.querySelector('#прогон').addEventListener('click', прогон);
window.прогон = прогон;
WorshipEdit.init();
</script>
</body>
</html>
