<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB Kitchen — BackOffice</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        try { sessionStorage.setItem('srsk_ab_kitchen_context', '1'); } catch {}
    </script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center">
    <main class="card bg-base-100 shadow-xl w-full max-w-md mx-4">
        <div class="card-body items-center text-center">
            <h1 class="card-title text-2xl">AB Kitchen</h1>
            <p class="opacity-60">Открываем кухонный раздел…</p>
            <span class="loading loading-spinner loading-lg text-warning mt-4" aria-label="Загрузка"></span>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js?v=4"></script>
    <script src="../js/auth-check.js?v=7"></script>
    <script>
        function openAbKitchen() {
            window.location.replace('../kitchen/menu.html');
        }

        if (window.currentUser) {
            openAbKitchen();
        } else {
            window.addEventListener('authReady', openAbKitchen, { once: true });
        }
    </script>
</body>
</html>
