<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет доступа — AB Kitchen</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center">
    <main class="card bg-base-100 shadow-xl w-full max-w-lg mx-4">
        <div class="card-body text-center items-center">
            <h1 class="card-title text-2xl">Нет доступа к AB Kitchen</h1>
            <p class="text-base-content/70">
                Для этого аккаунта не назначена роль «Администратор AB Kitchen»
                или доступ к локации AB Kitchen.
            </p>
            <p class="text-sm text-base-content/60">Обратитесь к администратору системы.</p>
            <button id="logout-button" class="btn btn-warning mt-3">Войти под другим аккаунтом</button>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script>
        document.getElementById('logout-button').addEventListener('click', async () => {
            try { await window.supabaseClient.auth.signOut(); } catch (error) {
                console.error('Sign out failed:', error);
            }
            try { sessionStorage.setItem('srsk_ab_kitchen_context', '1'); } catch {}
            window.location.replace('/login.html?redirect=%2Fab-kitchen%2F');
        });
    </script>
</body>
</html>
