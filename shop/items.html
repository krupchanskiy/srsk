<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=6"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары магазина — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=10">
    <style>
        .nums { font-variant-numeric: tabular-nums; }
        .thumb { width: 48px; height: 36px; object-fit: cover; border-radius: 6px; flex: none; }
        .thumb-empty { width: 48px; height: 36px; border-radius: 6px; flex: none;
                       display: grid; place-items: center; }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1">

        <div class="mb-5 flex flex-wrap items-end gap-3">
            <div>
                <h1 class="text-2xl font-bold" data-i18n="shop_items_title">Товары магазина</h1>
                <p class="text-sm opacity-60" data-i18n="shop_items_hint">Цена одна на все партии: меняете здесь — меняется на кассе.</p>
            </div>
            <button class="btn btn-sm ml-auto" id="newItem" data-permission="shop_receive"
                    style="background: var(--current-color); color: #fff;" data-i18n="shop_new_item">Новый товар</button>
        </div>

        <div class="flex flex-wrap gap-3 mb-4">
            <label class="input input-bordered input-sm flex items-center gap-2 flex-1 min-w-48">
                <input id="q" type="search" class="grow" data-i18n-placeholder="shop_search_by_name" placeholder="Поиск по названию">
            </label>
            <select class="select select-bordered select-sm" id="catFilter"></select>
            <label class="label cursor-pointer gap-2">
                <input type="checkbox" class="checkbox checkbox-sm" id="onlyLow">
                <span class="label-text text-sm" data-i18n="shop_only_low">Только заканчивающиеся</span>
            </label>
        </div>

        <div class="card bg-base-100 shadow">
            <div class="overflow-x-auto">
                <table class="table table-sm stack" id="itemsTbl">
                    <thead>
                        <tr>
                            <th data-i18n="shop_item_col">Товар</th>
                            <th data-i18n="shop_category">Категория</th>
                            <th class="text-right" data-i18n="shop_price_inr">Цена, ₹</th>
                            <th class="text-right" data-i18n="shop_stock_col">На полке</th>
                            <th class="text-right" data-i18n="shop_min_qty_col">Сигнал при</th>
                            <th data-i18n="shop_source">Источник</th><th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <dialog id="itemModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4" id="modalTitle" data-i18n="shop_item_col">Товар</h3>
            <div class="flex flex-col gap-3">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <label class="form-control md:col-span-2">
                        <div class="label py-1"><span class="label-text text-sm" data-i18n="shop_name_label">Название</span></div>
                        <input type="text" class="input input-bordered" id="fName">
                    </label>
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-sm" data-i18n="shop_category">Категория</span></div>
                        <select class="select select-bordered" id="fCat"></select>
                    </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-sm" data-i18n="shop_sale_price">Цена продажи, ₹</span></div>
                        <input type="number" class="input input-bordered nums" id="fPrice">
                    </label>
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-sm" data-i18n="shop_min_qty">Сигнал при остатке</span></div>
                        <input type="number" class="input input-bordered nums" id="fMin">
                    </label>
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-sm" data-i18n="shop_source">Источник</span></div>
                        <select class="select select-bordered" id="fSource">
                            <option value="consignment" data-i18n="shop_consignment_opt">Реализация</option>
                            <option value="own" data-i18n="shop_own_output">Свой выпуск</option>
                        </select>
                    </label>
                </div>
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-sm" data-i18n="shop_photo">Фото</span></div>
                    <input type="file" class="file-input file-input-bordered file-input-sm" id="fPhoto" accept="image/*">
                    <span class="text-xs opacity-60 mt-1" data-i18n="shop_photo_hint">Товар на кассе выбирают глазами — фото помогает больше названия</span>
                </label>
                <label class="label cursor-pointer justify-start gap-2">
                    <input type="checkbox" class="checkbox checkbox-sm" id="fActive" checked>
                    <span class="label-text text-sm" data-i18n="shop_on_sale">В продаже</span>
                </label>
            </div>
            <div class="modal-action">
                <button class="btn btn-ghost" onclick="itemModal.close()" data-i18n="cancel">Отмена</button>
                <button class="btn" id="saveItem" style="background: var(--current-color); color: #fff;" data-i18n="save">Сохранить</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button data-i18n="close">закрыть</button></form>
    </dialog>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=16"></script>
    <script src="../js/layout.js?v=111"></script>
    <script src="../js/auth-check.js?v=13"></script>
    <script src="../js/translit.js"></script>
    <script src="../js/shop-utils.js?v=2"></script>
    <script src="../js/pages/shop-items.js?v=3"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'shop', menuId: 'shop_goods', itemId: 'shop_items' });
            await ShopItems.init();
        }
        init();
    </script>
</body>
</html>
