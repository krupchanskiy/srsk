<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=4"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Материал — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=8">
    <style>
        .кусок { outline: none; min-height: 1.6em; line-height: 1.7; }
        .кусок:empty::before { content: attr(data-подсказка); opacity: .35; }
        .кусок-p { font-size: 17px; }
        .кусок-h2 { font-size: 20px; font-weight: 700; }
        .кусок-h3 { font-size: 18px; font-weight: 600; }
        .блок:hover .ручки, .блок:focus-within .ручки { opacity: 1; }
        .ручки { opacity: 0; transition: opacity .15s; }
        @media (max-width: 1199px) { .ручки { opacity: 1; } }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 900px;">

        <div class="text-sm mb-3">
            <a href="library.html" class="link link-hover opacity-70" data-i18n="worship_library_title">Библиотека</a>
        </div>

        <div class="flex flex-wrap items-start gap-3 mb-4">
            <h1 class="text-2xl font-bold tracking-tight flex-1 min-w-full desktop:min-w-0" id="режим">Материал</h1>
            <span class="text-sm opacity-60" id="сохранение"></span>
            <div class="flex flex-wrap gap-2" id="actions"></div>
        </div>

        <div class="card bg-base-100 shadow mb-4" id="поля">
            <div class="card-body p-5 desktop:p-6 gap-4">
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs uppercase tracking-widest opacity-60" data-i18n="worship_field_title">Название</span></div>
                    <input id="заголовок" type="text" class="input input-bordered text-lg font-semibold"
                           placeholder="Например: Хари-бхакти-виласа, том 1" maxlength="200">
                </label>
                <label class="form-control">
                    <div class="label py-1">
                        <span class="label-text text-xs uppercase tracking-widest opacity-60" data-i18n="worship_field_summary">О чём это</span>
                    </div>
                    <textarea id="описание" class="textarea textarea-bordered" rows="2" maxlength="500"
                              placeholder="Одной-двумя фразами: о чём материал и кому пригодится"></textarea>
                    <div class="label py-1"><span class="label-text-alt opacity-60" data-i18n="worship_summary_hint">Без описания библиотека за полгода превращается в свалку файлов с именами вроде scan_0012.pdf.</span></div>
                </label>
                <div class="grid grid-cols-1 desktop:grid-cols-3 gap-3">
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-xs uppercase tracking-widest opacity-60" data-i18n="worship_field_section">Раздел</span></div>
                        <select id="раздел" class="select select-bordered"></select>
                    </label>
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-xs uppercase tracking-widest opacity-60" data-i18n="worship_field_author">Автор</span></div>
                        <input id="автор" type="text" class="input input-bordered" maxlength="200">
                    </label>
                    <label class="form-control">
                        <div class="label py-1"><span class="label-text text-xs uppercase tracking-widest opacity-60" data-i18n="worship_field_source">Откуда взято</span></div>
                        <input id="источник" type="text" class="input input-bordered" maxlength="300">
                    </label>
                </div>
            </div>
        </div>

        <!-- вложения: файл у нас либо ссылка наружу -->
        <div class="card bg-base-100 shadow mb-4">
            <div class="card-body p-5 desktop:p-6">
                <h2 class="card-title text-lg mb-1" data-i18n="worship_files_title">Файлы и ссылки</h2>
                <p class="text-sm opacity-60 mb-2" data-i18n="worship_files_hint">Видео, которое есть на ютубе,
                    добавляйте ссылкой. Файлом — то, чего больше нигде нет.</p>
                <ul class="list-none m-0 p-0" id="вложения"></ul>
                <div class="flex flex-wrap gap-2 mt-3" data-permission="worship_write">
                    <button class="btn btn-sm btn-outline" id="добавитьФайл">Загрузить файл</button>
                    <button class="btn btn-sm btn-outline" id="добавитьСсылку">Добавить ссылку</button>
                </div>
                <div id="ходЗагрузки" hidden class="mt-3">
                    <progress class="progress w-full" id="полоса" max="100" value="0"></progress>
                    <div class="text-sm opacity-70 mt-1" id="ходПодпись"></div>
                </div>
            </div>
        </div>

        <!-- свой текст: тот же редактор, что у стандартов -->
        <div class="card bg-base-100 shadow">
            <div class="card-body p-5 desktop:p-8">
                <h2 class="card-title text-lg mb-1" data-i18n="worship_own_text">Свой текст</h2>
                <p class="text-sm opacity-60 mb-3" data-i18n="worship_own_text_hint">Заметка, пересказ, выписка —
                    всё, что пригодится рядом с файлом. Можно оставить пустым.</p>
                <div id="блоки"></div>
                <div class="flex flex-wrap items-center gap-2 mt-4" data-permission="worship_write">
                    <button class="btn btn-xs btn-outline font-bold" id="жирный">Ж</button>
                    <button class="btn btn-xs btn-outline" id="ссылка">Ссылка</button>
                    <span class="opacity-30">|</span>
                    <button class="btn btn-xs btn-outline" data-добавить="p">Абзац</button>
                    <button class="btn btn-xs btn-outline" data-добавить="h2">Заголовок</button>
                    <button class="btn btn-xs btn-outline" data-добавить="ul">Список</button>
                    <button class="btn btn-xs btn-outline" data-добавить="ol">По шагам</button>
                    <button class="btn btn-xs btn-outline" data-добавить="note">Заметка</button>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="файл" hidden>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js"></script>
    <script src="../js/cache.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js?v=100"></script>
    <script src="../js/date-utils.js"></script>
    <script src="../js/auth-check.js?v=12"></script>
    <script src="../js/media.js?v=1"></script>
    <script src="../js/worship-doc.js?v=5"></script>
    <script src="../js/pages/worship-material.js?v=2"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_library' });
            await WorshipMaterial.init();
        }
        init();
    </script>
</body>
</html>
