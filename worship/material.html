<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=6"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Материал — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=10">
    <style>
        .кусок { outline: none; min-height: 1.6em; line-height: 1.7; }
        .кусок:empty::before { content: attr(data-подсказка); opacity: .35; }
        .кусок-p { font-size: 17px; }
        .кусок-h2 { font-size: 20px; font-weight: 700; }
        .кусок-h3 { font-size: 18px; font-weight: 600; }
        .блок:hover .ручки, .блок:focus-within .ручки { opacity: 1; }
        .ручки { opacity: 0; transition: opacity .15s; }
        @media (max-width: 1199px) { .ручки { opacity: 1; } }
            #текст { outline: none; font-size: 17px; line-height: 1.75; min-height: 30vh; }
        #текст p { margin: 0 0 .75em; }
        #текст h2 { font-weight: 700; margin: 1.2em 0 .5em; }
        #текст h3 { font-weight: 600; margin: 1em 0 .4em; }
        #текст ul { list-style: disc; padding-left: 1.6em; margin: 0 0 .75em; }
        #текст ol { list-style: decimal; padding-left: 1.6em; margin: 0 0 .75em; }
        #текст blockquote { background: oklch(var(--b2)); border-radius: .75rem;
                            padding: .75rem 1rem; margin: 0 0 .75em; }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 900px;">

        <div class="text-sm mb-3 flex flex-wrap gap-3">
            <a href="library.html" class="link link-hover opacity-70" data-i18n="worship_library_title">Библиотека</a>
            <a href="search.html" class="link link-hover opacity-70">Поиск по модулю</a>
        </div>

        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-4">
            <div class="text-xs uppercase tracking-widest opacity-60" id="режим">Материал</div>
            <span class="text-sm ml-auto" id="сохранение"></span>
            <div class="flex items-center gap-2" id="actions"></div>
        </div>

        <!-- Название — заголовок карточки, а не первое поле анкеты.
             Всё, чем материал описывается, — служебная строка под ним. -->
        <div class="mb-5" id="поля">
            <input id="заголовок" type="text"
                   class="w-full bg-transparent border-0 px-0 text-3xl font-bold tracking-tight
                          focus:outline-none placeholder:opacity-30"
                   placeholder="Название книги, скана или заметки" maxlength="200">

            <textarea id="описание" rows="2"
                      class="w-full bg-transparent border-0 px-0 mt-2 text-[17px] resize-none
                             focus:outline-none placeholder:opacity-40"
                      placeholder="О чём это: чтобы через полгода было понятно, зачем этот файл"
                      maxlength="500"></textarea>

            <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-sm">
                <label class="flex items-center gap-2">
                    <span class="opacity-70" data-i18n="worship_field_section">Раздел</span>
                    <select id="раздел" class="select select-sm select-bordered min-w-40"></select>
                </label>
                <label class="flex items-center gap-2">
                    <span class="opacity-70" data-i18n="worship_field_author">Автор</span>
                    <input id="автор" type="text" class="input input-sm input-bordered w-44"
                           placeholder="Санатана Госвами" maxlength="200">
                </label>
                <label class="flex items-center gap-2 flex-1 min-w-48">
                    <span class="opacity-70 whitespace-nowrap" data-i18n="worship_field_source">Откуда</span>
                    <input id="источник" type="text" class="input input-sm input-bordered flex-1"
                           placeholder="Издание, сайт, кто передал" maxlength="300">
                </label>
                <div class="flex items-center gap-2" id="тегиБлок">
                    <span class="opacity-70" data-i18n="worship_tags">Теги</span>
                    <div class="flex flex-wrap items-center gap-2" id="теги"></div>
                </div>
            </div>
        </div>

        <!-- вложения: файл у нас либо ссылка наружу -->
        <div class="card bg-base-100 shadow mb-4">
            <div class="card-body p-5 desktop:p-6">
                <h2 class="card-title text-lg mb-1" data-i18n="worship_files_title">Файлы и ссылки</h2>
                <p class="text-sm opacity-60 mb-2" data-i18n="worship_files_hint">Видео, которое есть на ютубе,
                    добавляйте ссылкой. Файлом — то, чего больше нигде нет.</p>
                <ul class="list-none m-0 p-0" id="вложения"></ul>
                <div class="flex flex-wrap gap-2 mt-3" data-permission="worship_write">
                    <button class="btn btn-sm btn-outline" id="добавитьФайл">Загрузить файл</button>
                    <button class="btn btn-sm btn-outline" id="добавитьСсылку">Добавить ссылку</button>
                </div>
                <div id="ходЗагрузки" hidden class="mt-3">
                    <progress class="progress w-full" id="полоса" max="100" value="0"></progress>
                    <div class="text-sm opacity-70 mt-1" id="ходПодпись"></div>
                </div>
            </div>
        </div>

        <!-- Свой текст правится тем же редактором, что и стандарт:
             формат документа один на оба экрана. -->
        <div class="card bg-base-100 shadow">
            <div class="card-body p-5 desktop:p-8">
                <div class="flex flex-wrap items-center gap-1 mb-3 pb-3 border-b border-base-200"
                     data-permission="worship_write">
                    <div class="join mr-1">
                        <button class="btn btn-sm btn-ghost join-item px-2" id="откатить"
                                title="Отменить (Ctrl+Z)" aria-label="Отменить">↶</button>
                        <button class="btn btn-sm btn-ghost join-item px-2" id="повторить"
                                title="Вернуть (Ctrl+Shift+Z)" aria-label="Вернуть">↷</button>
                    </div>
                    <span class="w-px h-5 bg-base-300"></span>
                    <button class="btn btn-sm btn-ghost font-bold w-9 px-0" id="жирный" title="Жирный">Ж</button>
                    <button class="btn btn-sm btn-ghost w-9 px-0 font-bold" data-стиль="h2" title="Заголовок">H2</button>
                    <button class="btn btn-sm btn-ghost w-9 px-0 font-semibold text-sm" data-стиль="h3"
                            title="Подзаголовок">H3</button>
                    <button class="btn btn-sm btn-ghost w-9 px-0" id="список" title="Список" aria-label="Список">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"></circle>
                            <circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
                            <circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"></circle>
                            <path d="M9 6h11M9 12h11M9 18h11"></path>
                        </svg>
                    </button>
                    <button class="btn btn-sm btn-ghost w-9 px-0" id="поШагам" title="По шагам"
                            aria-label="Нумерованный список">1—</button>
                    <button class="btn btn-sm btn-ghost w-9 px-0" data-стиль="note" title="Заметка">❝</button>
                    <button class="btn btn-sm btn-ghost" id="ссылка" title="Ссылка">Ссылка</button>
                </div>

                <div id="текст" contenteditable="true" spellcheck="true" style="max-width: 68ch;"></div>
                <p class="text-sm opacity-70 mt-4" data-i18n="worship_own_text_hint">Заметка, пересказ, выписка —
                    всё, что пригодится рядом с файлом. Можно оставить пустым.</p>
            </div>
        </div>
    </main>

    <!-- на телефоне после правки текста кнопка «Сохранить» оставалась
         в самом верху длинной страницы -->
    <div class="sticky bottom-0 z-20 bg-base-200/95 border-t border-base-300 py-2 px-4
                flex items-center gap-3 no-print" data-permission="worship_write">
        <span class="text-sm opacity-60" id="сохранениеНизу"></span>
        <span class="flex-1"></span>
        <button class="btn btn-sm" id="сохранитьНизу"
                style="background: var(--current-color); color:#fff;">Сохранить</button>
    </div>

    <input type="file" id="файл" multiple hidden
           accept="image/jpeg,image/png,image/webp,image/heic,application/pdf,audio/*,video/mp4,video/quicktime">

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=17"></script>
    <script src="../js/layout.js?v=111"></script>
    <script src="../js/date-utils.js?v=4"></script>
    <script src="../js/auth-check.js?v=13"></script>
    <script src="../js/media.js?v=2"></script>
    <script src="../js/worship-doc.js?v=5"></script>
    <script src="../js/worship-editor-doc.js?v=1"></script>
    <script src="../js/worship-tags.js?v=4"></script>
    <script src="../js/pages/worship-material.js?v=8"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_library' });
            await WorshipMaterial.init();
        }
        init();
    </script>
</body>
</html>
