<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=6"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подборки — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=10">
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 1060px;">

        <div class="mb-5 flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-full desktop:min-w-0">
                <h1 class="text-3xl font-bold tracking-tight" data-i18n="worship_kits_title">Подборки</h1>
                <p class="text-sm opacity-60 mt-1" data-i18n="worship_kits_hint">Дорожка для того,
                    кто только начинает: что прочитать, что посмотреть и в каком порядке.
                    Выданную подборку человек читает ещё до приезда, в портале гостя.</p>
            </div>
            <button class="btn btn-sm" id="newKit" data-permission="worship_write"
                    style="background: var(--current-color); color: #fff;"
                    data-i18n="worship_new_kit">Новая подборка</button>
        </div>

        <div id="list"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=15"></script>
    <script src="../js/layout.js?v=110"></script>
    <script src="../js/date-utils.js?v=4"></script>
    <script src="../js/auth-check.js?v=13"></script>
    <script src="../js/pages/worship-kits.js?v=3"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_kits' });
            await WorshipKits.init();
        }
        init();
    </script>
</body>
</html>
