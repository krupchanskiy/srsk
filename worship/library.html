<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=7"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=26">
    <style>
        /* «+ материал» нужен редко: появляется при наведении на раздел */
        .ручкиСтроки { opacity: 0; transition: opacity .15s; }
        .разделСписка:hover .ручкиСтроки, .ручкиСтроки:focus-visible { opacity: 1; }
        /* на сенсорном экране наведения нет — там кнопка видна всегда и читаема:
           полупрозрачная она давала 2.96:1 */
        @media (hover: none) { .ручкиСтроки { opacity: 1; } }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 1060px;">

        <div class="mb-5 flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-full desktop:min-w-0">
                <h1 class="text-3xl font-bold tracking-tight" data-i18n="worship_library_title">Библиотека</h1>
                <p class="text-sm opacity-60 mt-1" data-i18n="worship_library_hint">Книги, сканы, записи и заметки.
                    В отличие от стандарта, материал ничего не обязывает — он помогает разобраться.</p>
            </div>
            <button class="btn btn-sm btn-outline" id="manageSections" data-permission="worship_approve"
                    data-i18n="worship_sections_title">Разделы</button>
            <button class="btn btn-sm" id="newMaterial" data-permission="worship_write"
                    style="background: var(--current-color); color: #fff;"
                    data-i18n="worship_new_material">Добавить материал</button>
        </div>

        <div class="flex flex-wrap gap-3 items-center mb-4">
            <label class="input input-bordered flex items-center gap-2 flex-1 min-w-64">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" class="opacity-50" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
                </svg>
                <input id="q" name="q" type="search" class="grow"
                       data-i18n-placeholder="worship_library_search" placeholder="Искать по названию и описанию…">
            </label>
            <select id="вид" class="select select-bordered select-sm" aria-label="Вид материала">
                <option value="">Любой вид</option>
                <option value="file">Файлы</option>
                <option value="link">Ссылки</option>
                <option value="text">Заметки</option>
            </select>
            <label class="label cursor-pointer justify-start gap-2">
                <input type="checkbox" class="checkbox" id="showArchive">
                <span class="label-text text-sm" data-i18n="worship_with_archived">Показывать и отменённые</span>
            </label>
        </div>

        <div id="list"></div>
    </main>

    <dialog id="sectionsModal" class="modal">
        <div class="modal-box max-w-xl">
            <h3 class="font-bold text-lg mb-1" data-i18n="worship_sections_title">Разделы</h3>
            <p class="text-sm opacity-60 mb-4" data-i18n="worship_sections_modal_hint">Порядок задаётся стрелками.
                Раздел с содержимым не удаляется — его можно скрыть.</p>
            <ul class="list-none m-0 p-0" id="sectionsList"></ul>
            <div class="flex flex-wrap gap-2 mt-4">
                <input id="newSectionName" type="text" class="input input-bordered input-sm flex-1 min-w-40"
                       data-i18n-placeholder="worship_section_new" placeholder="Название нового раздела" maxlength="100">
                <button class="btn btn-sm" id="addSection"
                        style="background: var(--current-color); color:#fff;">Добавить</button>
            </div>
            <div class="modal-action">
                <form method="dialog"><button class="btn btn-sm">Готово</button></form>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>закрыть</button></form>
    </dialog>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=20"></script>
    <script src="../js/layout.js?v=119"></script>
    <script src="../js/date-utils.js?v=5"></script>
    <script src="../js/auth-check.js?v=16"></script>
    <script src="../js/pages/worship-library.js?v=9"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_library' });
            await WorshipLibrary.init();
        }
        init();
    </script>
</body>
</html>
