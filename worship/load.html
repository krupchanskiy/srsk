<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=6"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка отдела — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=15">
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 1060px;">

        <div role="tablist" class="tabs tabs-bordered mb-4 w-fit">
            <a role="tab" class="tab" href="schedule.html" data-i18n="worship_schedule_title">Расписание</a>
            <a role="tab" class="tab" href="people.html" data-i18n="worship_people_title">Люди отдела</a>
            <a role="tab" class="tab tab-active" href="load.html" data-i18n="worship_load_title">Загрузка</a>
        </div>

        <div class="flex flex-wrap items-end gap-3 mb-4">
            <div class="flex-1 min-w-full desktop:min-w-0">
                <h1 class="text-3xl font-bold tracking-tight" data-i18n="worship_load_title">Загрузка</h1>
                <p class="text-sm opacity-70 mt-1" data-i18n="worship_load_hint">Кто сколько несёт,
                    кого ни разу не ставили и какая служба закрывается тяжелее прочих.</p>
            </div>
            <div class="join">
                <button class="btn btn-sm join-item" data-период="неделя">Неделя</button>
                <button class="btn btn-sm join-item" data-период="месяц">Месяц</button>
                <button class="btn btn-sm join-item" data-период="вперёд">Впереди</button>
            </div>
        </div>

        <!-- четыре числа, с которых старший начинает разговор о нагрузке -->
        <div class="grid gap-3 mb-5"
             style="grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));" id="сводка"></div>

        <!-- на что посмотреть: не цифры, а расхождения со здравым смыслом -->
        <section id="находкиБлок" hidden
                 class="rounded-xl border border-warning/40 bg-warning/10 p-4 mb-5">
            <h2 class="надзаголовок mb-1">На что обратить внимание</h2>
            <ul class="list-none m-0 p-0" id="находки"></ul>
        </section>

        <section class="mb-5">
            <h2 class="надзаголовок mb-1.5">Кто сколько несёт</h2>
            <div class="card bg-base-100 shadow">
                <div class="card-body p-5">
                    <ul class="list-none m-0 p-0" id="люди"></ul>
                </div>
            </div>
        </section>

        <section id="свободныеБлок" hidden class="mb-5">
            <h2 class="надзаголовок mb-1.5">Ни разу не ставили</h2>
            <div class="flex flex-wrap gap-2" id="свободные"></div>
        </section>

        <section>
            <h2 class="надзаголовок mb-1.5">Службы: где остаются дыры</h2>
            <div class="card bg-base-100 shadow">
                <div class="card-body p-5">
                    <ul class="list-none m-0 p-0" id="службы"></ul>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=17"></script>
    <script src="../js/layout.js?v=116"></script>
    <script src="../js/date-utils.js?v=4"></script>
    <script src="../js/auth-check.js?v=13"></script>
    <script src="../js/pages/worship-load.js?v=1"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_schedule' });
            await WorshipLoad.init();
        }
        init();
    </script>
</body>
</html>
