<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=6"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Набор снимков — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=14">
    <style>
        /* Ручки у снимка появляются при наведении; на телефоне наведения нет,
           поэтому там они видны всегда. */
        .группа .ручки { opacity: 0; transition: opacity .15s; }
        .группа:hover .ручки, .группа:focus-within .ручки { opacity: 1; }
        @media (hover: none) { .группа .ручки { opacity: 1; } }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 1060px;">

        <div class="text-sm mb-3 flex flex-wrap gap-3">
            <a href="gallery.html" class="link link-hover opacity-70" data-i18n="worship_gallery_title">Галерея</a>
            <a href="search.html" class="link link-hover opacity-70">Поиск по модулю</a>
        </div>

        <div class="flex flex-wrap items-start gap-3 mb-5">
            <div class="flex-1 min-w-full desktop:min-w-0">
                <h1 class="text-2xl font-bold tracking-tight" id="название">&nbsp;</h1>
                <p class="text-sm mt-1" id="подзаголовок"></p>
                <!-- теги строкой под описанием: нужны редко, отдельной полосы
                     поперёк экрана не заслуживают -->
                <div class="flex flex-wrap items-center gap-2 mt-2 text-sm" id="теги"></div>
            </div>
            <div class="flex items-center gap-2" id="actions"></div>
        </div>

        <div id="предупреждение" hidden
             class="rounded-xl border border-warning/40 bg-warning/10 p-4 mb-4 text-sm"></div>

        <!-- загрузка пачкой: очередь по одному со счётчиком; уже загруженные
             не теряются, неудавшиеся помечены и грузятся кнопкой «повторить» -->
        <div id="ход" hidden class="card bg-base-100 shadow mb-4">
            <div class="card-body p-5">
                <div class="flex flex-wrap items-center gap-3">
                    <span class="font-semibold" id="ходПодпись"></span>
                    <span class="flex-1"></span>
                    <button class="btn btn-sm btn-outline" id="повторить" hidden>Повторить неудавшиеся</button>
                </div>
                <progress class="progress w-full mt-2" id="полоса" max="100" value="0"></progress>
                <ul class="list-none m-0 p-0 mt-2 text-sm" id="ходСписок"></ul>
            </div>
        </div>

        <div id="снимки" class="grid grid-cols-2 sm:grid-cols-3 desktop:grid-cols-4 gap-4"></div>
    </main>

    <input type="file" id="файлы" accept="image/*" multiple hidden>

    <!-- правка набора одним окном: раньше это были три системных prompt подряд,
         и дату приходилось печатать руками -->
    <dialog id="правкаМодал" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">Изменить набор</h3>
            <label class="form-control mb-3">
                <div class="label py-1"><span class="label-text">Название</span></div>
                <input id="правкаНазвание" type="text" class="input input-bordered" maxlength="200">
            </label>
            <label class="form-control mb-3">
                <div class="label py-1"><span class="label-text">Дата события</span></div>
                <input id="правкаДата" type="date" class="input input-bordered">
            </label>
            <label class="form-control mb-3">
                <div class="label py-1"><span class="label-text">Описание</span></div>
                <textarea id="правкаОписание" class="textarea textarea-bordered" rows="2" maxlength="500"></textarea>
            </label>
            <label class="form-control mb-3">
                <div class="label py-1"><span class="label-text">К какому стандарту относится</span></div>
                <select id="правкаСтатья" class="select select-bordered"></select>
                <div class="label py-1"><span class="label-text-alt opacity-60">На странице стандарта будет видно, что к нему есть снимки.</span></div>
            </label>
            <label class="label cursor-pointer justify-start gap-2">
                <input type="checkbox" class="checkbox checkbox-sm" id="правкаИнструкция">
                <span class="label-text">Это инструкция к стандарту — снимки покрупнее</span>
            </label>
            <div class="modal-action">
                <form method="dialog"><button class="btn btn-sm btn-ghost">Отмена</button></form>
                <button class="btn btn-sm" id="сохранитьПравку"
                        style="background: var(--current-color); color:#fff;">Сохранить</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>закрыть</button></form>
    </dialog>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=17"></script>
    <script src="../js/layout.js?v=112"></script>
    <script src="../js/date-utils.js?v=4"></script>
    <script src="../js/auth-check.js?v=13"></script>
    <script src="../js/media.js?v=2"></script>
    <script src="../js/worship-tags.js?v=4"></script>
    <script src="../js/pages/worship-album.js?v=8"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_gallery' });
            await WorshipAlbum.init();
        }
        init();
    </script>
</body>
</html>
