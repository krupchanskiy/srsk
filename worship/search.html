<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=7"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <!-- соединение с базой открывается заранее: иначе первое обращение
         к ней ждёт DNS и рукопожатие TLS уже после загрузки скриптов -->
    <link rel="preconnect" href="https://mymrijdfqeevoaocbzfy.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=26">
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1" style="max-width: 1060px;">

        <h1 class="text-2xl font-bold tracking-tight mb-1">Поиск по модулю</h1>
        <p class="text-sm opacity-70 mb-4">Сразу по стандартам, библиотеке и папкам со снимками.</p>

        <form class="mb-4" id="форма">
            <label class="input input-bordered flex items-center gap-3 h-14">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" class="opacity-50" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
                </svg>
                <input id="q" name="q" type="search" class="grow text-lg"
                       data-i18n-placeholder="worship_search_hint"
                       placeholder="Как делается: одевание, арати, бхога…">
            </label>
        </form>

        <!-- теги поверх поиска, а не внутри поискового образа: иначе
             переименование тега потребовало бы пересборки всего индекса -->
        <div class="flex flex-wrap items-center gap-2 mb-4" id="теги"></div>

        <div class="mb-4 -mt-2" data-permission="worship_approve">
            <button class="btn btn-xs btn-ghost opacity-70" id="вестиТеги">Вести словарь тегов</button>
        </div>



        <div id="итог"></div>
    </main>

    <!-- словарь тегов ведёт старший: переименовать или слить два в один -->
    <dialog id="tagsModal" class="modal">
        <div class="modal-box max-w-xl">
            <h3 class="font-bold text-lg mb-1">Словарь тегов</h3>
            <p class="text-sm opacity-60 mb-4">Тег один на весь модуль. Слияние переносит все
                связи и не ломается, если у объекта стояли оба тега.</p>
            <ul class="list-none m-0 p-0" id="словарь"></ul>
            <div class="modal-action">
                <form method="dialog"><button class="btn btn-sm">Готово</button></form>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>закрыть</button></form>
    </dialog>

    <!-- переименование и слияние: прежде это были prompt, где тег надо было
         вписать руками — промах уносил чужие связи -->
    <dialog id="тегМодал" class="modal">
        <div class="modal-box max-w-md">
            <h3 class="font-bold text-lg mb-3" id="тгЗаголовок"></h3>
            <label class="form-control mb-2" id="тгИмяБлок">
                <span class="label-text mb-1">Название</span>
                <input id="тгИмя" type="text" class="input input-bordered" maxlength="60">
            </label>
            <label class="form-control mb-2" id="тгКудаБлок" hidden>
                <span class="label-text mb-1">С каким тегом слить</span>
                <select id="тгКуда" class="select select-bordered"></select>
                <span class="label-text-alt opacity-60 mt-1" id="тгПоследствия"></span>
            </label>
            <div class="modal-action">
                <form method="dialog"><button class="btn btn-sm">Отмена</button></form>
                <button class="btn btn-sm" id="тгСохранить"
                        style="background: var(--current-color); color:#fff;">Готово</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>закрыть</button></form>
    </dialog>

    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/cache.js?v=2"></script>
    <script src="../js/utils.js?v=20"></script>
    <script src="../js/layout.js?v=119"></script>
    <script src="../js/date-utils.js?v=5"></script>
    <script src="../js/auth-check.js?v=16"></script>
    <script src="../js/pages/worship-search.js?v=6"></script>
    <script>
        async function init() {
            await Layout.init({ module: 'worship', menuId: 'worship_main', itemId: 'worship_home' });
            await WorshipSearch.init();
        }
        init();
    </script>
</body>
</html>
