<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="../js/color-init.js?v=2"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цены — ШРСК</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { screens: { 'desktop': '1200px' } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css?v=3">
</head>
<body class="bg-base-200 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-6 flex-1">

        <div class="mb-6">
            <h1 class="text-2xl font-bold" data-i18n="prices_title">Цены продуктов</h1>
            <p class="text-sm opacity-60" id="pricesCount" data-i18n="loading">Загрузка...</p>
        </div>

        <div id="noAccess" class="alert alert-warning hidden mb-4">
            <span data-i18n="prices_no_access">Нет доступа к ценам</span>
        </div>

        <div id="pricesContent">
            <div class="flex flex-col sm:flex-row gap-4 mb-4 items-start sm:items-center">
                <div class="flex-1 max-w-md relative w-full">
                    <input type="text" id="searchInput" placeholder="Поиск по имени..." class="input input-bordered w-full" data-i18n-placeholder="search_placeholder" />
                </div>
                <label class="label cursor-pointer gap-2">
                    <input type="checkbox" id="onlyWithoutPrice" class="checkbox checkbox-sm" />
                    <span class="label-text" data-i18n="prices_only_without">Только без цены</span>
                </label>
            </div>

            <div class="flex flex-wrap gap-2 mb-6" id="categoryFilters"></div>

            <div class="bg-base-100 rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="table w-full">
                        <thead>
                            <tr class="border-b border-base-200">
                                <th class="bg-base-100" data-i18n="col_name">Название</th>
                                <th class="bg-base-100 hidden sm:table-cell" data-i18n="col_category">Категория</th>
                                <th class="bg-base-100 w-20" data-i18n="col_unit">Ед. изм.</th>
                                <th class="bg-base-100 text-right" data-i18n="price">Цена</th>
                                <th class="bg-base-100 hidden sm:table-cell" data-i18n="prices_col_since">Действует с</th>
                                <th class="bg-base-100 w-28"></th>
                            </tr>
                        </thead>
                        <tbody id="pricesTable">
                            <tr><td colspan="6"><div class="skeleton h-6 w-full my-2"></div></td></tr>
                            <tr><td colspan="6"><div class="skeleton h-6 w-full my-2"></div></td></tr>
                            <tr><td colspan="6"><div class="skeleton h-6 w-full my-2"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <!-- Новая цена -->
    <dialog id="priceModal" class="modal">
        <div class="modal-box relative">
            <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" data-action="close-modal" data-modal="priceModal">✕</button>
            <h3 class="font-bold text-lg mb-1" data-i18n="prices_new_title">Новая цена</h3>
            <p class="text-sm opacity-60 mb-4" id="priceModalProduct"></p>
            <form id="priceForm" class="space-y-4">
                <input type="hidden" name="product_id" />
                <div id="firstPriceHint" class="alert alert-info text-sm hidden">
                    <span data-i18n="prices_first_hint">Первая цена по продукту действует и на прошлые даты.</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="label"><span class="label-text font-medium" data-i18n="prices_field_price">Цена за единицу, ₹</span></label>
                        <input type="number" name="price" min="0" step="0.01" class="input input-bordered w-full" required />
                    </div>
                    <div>
                        <label class="label"><span class="label-text font-medium" data-i18n="prices_field_from">Действует с</span></label>
                        <input type="date" name="valid_from" class="input input-bordered w-full" required />
                    </div>
                </div>
                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="prices_field_reason">Причина</span></label>
                    <select name="reason_category" class="select select-bordered w-full" id="reasonSelect"></select>
                </div>
                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="prices_field_comment">Комментарий</span></label>
                    <textarea name="comment" rows="2" class="textarea textarea-bordered w-full"></textarea>
                </div>
                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="priceModal" data-i18n="cancel">Отменить</button>
                    <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- История цен -->
    <dialog id="historyModal" class="modal">
        <div class="modal-box relative max-w-2xl">
            <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" data-action="close-modal" data-modal="historyModal">✕</button>
            <h3 class="font-bold text-lg mb-1" data-i18n="prices_history_title">История цен</h3>
            <p class="text-sm opacity-60 mb-4" id="historyProduct"></p>
            <div id="historyBody" class="space-y-2"></div>
        </div>
    </dialog>

    <!-- Исправление записи -->
    <dialog id="correctModal" class="modal">
        <div class="modal-box relative">
            <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" data-action="close-modal" data-modal="correctModal">✕</button>
            <h3 class="font-bold text-lg mb-1" data-i18n="prices_correct_title">Исправление записи цены</h3>
            <p class="text-sm opacity-60 mb-4" id="correctInfo"></p>
            <form id="correctForm" class="space-y-4">
                <input type="hidden" name="price_id" />
                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="prices_field_price">Цена за единицу, ₹</span></label>
                    <input type="number" name="new_price" min="0" step="0.01" class="input input-bordered w-full" required />
                </div>
                <div>
                    <label class="label"><span class="label-text font-medium" data-i18n="prices_correct_reason">Причина исправления</span></label>
                    <textarea name="reason" rows="2" class="textarea textarea-bordered w-full" required></textarea>
                </div>
                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="correctModal" data-i18n="cancel">Отменить</button>
                    <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="../js/config.js?v=5"></script>
    <script src="../js/auth-check.js?v=10"></script>
    <script src="../js/cache.js?v=1"></script>
    <script src="../js/utils.js?v=12"></script>
    <script src="../js/date-utils.js?v=4"></script>
    <script src="../js/layout.js?v=80"></script>
    <script src="../js/pages/kitchen-prices.js?v=1"></script>
</body>
</html>
